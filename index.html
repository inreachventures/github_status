<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub CI Status</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes btnFlash {
      0%   { background: rgba(0,212,170,0.35); border-color: rgba(0,212,170,0.7); }
      100% { background: rgba(0,212,170,0.1);  border-color: rgba(0,212,170,0.25); }
    }
    @keyframes tsFlash {
      0%   { color: #00d4aa; letter-spacing: 0.04em; }
      60%  { color: #00d4aa; letter-spacing: 0; }
      100% { color: #3a3a4a; letter-spacing: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1;   }
      50%       { opacity: 0.4; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes emojiPop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.25); }
      70%  { transform: scale(0.95); }
      100% { transform: scale(1); }
    }
    @keyframes msgFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background: #151c2e;
      min-height: 100vh;
      color: #e0e0e0;
      padding: 22px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(135deg, #151c2e 0%, #1b2a40 30%, #0f3636 55%, #153030 75%, #1a2030 100%);
    }

    /* ── Mood header ── */
    #mood-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      animation: fadeInUp 0.5s ease both;
      flex-wrap: wrap;
    }
    #mood-emoji {
      font-size: 3.8rem;
      line-height: 1;
      filter: drop-shadow(0 0 14px rgba(0, 212, 170, 0.5));
    }
    #mood-emoji.pop { animation: emojiPop 0.45s cubic-bezier(.36,.07,.19,.97) both; }
    #mood-label {
      font-size: 0.9rem;
      font-weight: 800;
      color: #00d4aa;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    #stats-pill {
      font-size: 0.85rem;
      color: #7ecfb8;
      font-weight: 600;
    }

    /* ── Mantra ── */
    #stats-bar {
      text-align: center;
      animation: fadeInUp 0.5s ease 0.1s both;
      margin-bottom: 10px;
    }
    #motivational-msg {
      font-size: 1rem;
      color: #667;
      font-style: italic;
      min-height: 1.2em;
    }
    #motivational-msg.entering { animation: msgFadeIn 0.45s ease both; }

    /* ── Cards: max 3 columns, wraps to new rows automatically ── */
    #cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      align-content: start;
      animation: fadeInUp 0.5s ease 0.2s both;
    }
    .card {
      background: rgba(22, 30, 48, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 14px;
      min-width: 0;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .card:hover {
      border-color: rgba(0, 212, 170, 0.28);
      box-shadow: 0 0 24px rgba(0, 212, 170, 0.07);
    }
    .card-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: #8ab8ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 1px;
    }
    .card-subtitle {
      font-size: 0.64rem;
      color: #445;
      margin-bottom: 10px;
    }

    /* ── Run rows ── */
    .run-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 7px;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      border-left: 3px solid transparent;
      transition: background 0.12s, border-color 0.12s;
      margin-bottom: 2px;
    }
    .run-row:hover       { background: rgba(255,255,255,0.045); }
    .run-row.success     { border-left-color: #00d4aa; }
    .run-row.failure     { border-left-color: #ff4757; }
    .run-row.running     { border-left-color: #ffd43b; }
    .run-row.other       { border-left-color: #3a3a4a; }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.success { background: #00d4aa; box-shadow: 0 0 5px rgba(0,212,170,0.5); }
    .dot.failure { background: #ff4757; box-shadow: 0 0 7px rgba(255,71,87,0.6); }
    .dot.running { background: #ffd43b; animation: pulse 1.4s ease-in-out infinite; isolation: isolate; }
    .dot.other   { background: #3a3a4a; }

    .run-row { align-items: flex-start; }
    .dot { margin-top: 5px; }
    .run-info { display: flex; flex-direction: column; min-width: 0; flex: 1; gap: 2px; }
    .run-title   { font-size: 0.72rem; font-weight: 600; color: #d0d0d0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .run-trigger { font-size: 0.63rem; color: #667; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .run-meta    { font-size: 0.61rem; color: #445; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Skeleton ── */
    .skeleton {
      height: 54px;
      border-radius: 8px;
      background: linear-gradient(90deg,
        rgba(255,255,255,0.03) 25%,
        rgba(255,255,255,0.07) 50%,
        rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      margin-bottom: 2px;
    }
    .err { color: #ff6b6b; font-size: 0.72rem; padding: 4px 2px; }

    /* ── Date separator ── */
    .date-sep {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 5px 2px;
      color: #2a2f3a;
      font-size: 0.57rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .date-sep::before, .date-sep::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.05);
    }
    .no-today-msg {
      font-size: 0.68rem;
      color: #445;
      padding: 4px 7px 2px;
      font-style: italic;
    }

    /* ── Automerge toggle ── */
    .automerge-btn {
      flex-shrink: 0;
      border-radius: 5px;
      font-size: 0.58rem;
      font-weight: 700;
      font-family: inherit;
      padding: 2px 6px;
      cursor: pointer;
      line-height: 1.5;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }
    .automerge-btn.am-off {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: #445;
    }
    .automerge-btn.am-off:hover  { border-color: rgba(0,212,170,0.35); color: #00d4aa; }
    .automerge-btn.am-on {
      background: rgba(0,212,170,0.12);
      border: 1px solid rgba(0,212,170,0.35);
      color: #00d4aa;
    }
    .automerge-btn.am-on:hover   { background: rgba(0,212,170,0.22); }
    .automerge-btn:disabled      { opacity: 0.4; pointer-events: none; }
    .merge-btn {
      flex-shrink: 0;
      border-radius: 5px;
      font-size: 0.58rem;
      font-weight: 700;
      font-family: inherit;
      padding: 2px 6px;
      cursor: pointer;
      line-height: 1.5;
      white-space: nowrap;
      background: rgba(0,212,170,0.12);
      border: 1px solid rgba(0,212,170,0.35);
      color: #00d4aa;
      transition: background 0.15s, opacity 0.15s;
    }
    .merge-btn:hover    { background: rgba(0,212,170,0.25); }
    .merge-btn:disabled { opacity: 0.4; pointer-events: none; }
    .merge-btn.merged   { background: transparent; border-color: rgba(255,255,255,0.1); color: #3a7a6a; cursor: default; }

    /* ── Footer ── */
    #footer {
      text-align: right;
      font-size: 0.64rem;
      color: #3a3a4a;
      animation: fadeInUp 0.5s ease 0.3s both;
    }

    /* ── Top-right controls ── */
    #top-controls {
      position: fixed;
      top: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 10;
    }
    #refresh-btn {
      background: rgba(0,212,170,0.1);
      border: 1px solid rgba(0,212,170,0.25);
      color: #00d4aa;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s;
      padding: 0;
    }
    #refresh-btn:hover  { background: rgba(0,212,170,0.18); }
    #refresh-btn:active { transform: scale(0.92); }
    #refresh-btn.loading { pointer-events: none; opacity: 0.5; }
    #refresh-btn.loading .ri { display: inline-block; animation: spin 0.7s linear infinite; }
    #refresh-btn.done { animation: btnFlash 0.9s ease forwards; }
    #last-refreshed.done { animation: tsFlash 1.6s ease forwards; }
    .ri { line-height: 1; }

    /* ── Interval control ── */
    #interval-ctrl {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 34px;
    }
    #interval-trigger {
      font-size: 0.65rem;
      font-weight: 700;
      color: #557;
      cursor: pointer;
      user-select: none;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      transition: color 0.12s, background 0.12s;
      white-space: nowrap;
    }
    #interval-trigger:hover { color: #00d4aa; background: rgba(0,212,170,0.08); }
    #interval-options {
      display: flex;
      align-items: center;
      gap: 3px;
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
      transition: max-width 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.2s ease;
    }
    #interval-options.open { max-width: 320px; opacity: 1; pointer-events: all; }
    .iopt {
      font-size: 0.61rem;
      font-weight: 600;
      color: #3a3a5a;
      cursor: pointer;
      padding: 3px 7px;
      border-radius: 7px;
      white-space: nowrap;
      user-select: none;
      transition: color 0.12s, background 0.12s;
    }
    .iopt:hover  { color: #00d4aa; }
    .iopt.active { color: #00d4aa; background: rgba(0,212,170,0.12); }
    #settings-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.13);
      color: #99a;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: color 0.15s, background 0.15s, transform 0.4s cubic-bezier(0.4,0,0.2,1);
      padding: 0;
    }
    #settings-btn:hover { color: #00d4aa; background: rgba(0,212,170,0.1); transform: rotate(75deg); }

    /* ── Settings overlay ── */
    #settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #settings-overlay.open { opacity: 1; pointer-events: all; }

    #settings-panel {
      background: rgba(16,16,32,0.97);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 18px;
      padding: 26px 24px 22px;
      width: 440px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 64px);
      overflow-y: auto;
      transform: translateY(-14px) scale(0.97);
      transition: transform 0.22s cubic-bezier(0.4,0,0.2,1);
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }
    #settings-overlay.open #settings-panel { transform: translateY(0) scale(1); }

    #settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    #settings-header span {
      font-size: 0.85rem;
      font-weight: 800;
      color: #00d4aa;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    #settings-close {
      background: none;
      border: none;
      color: #445;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 2px 5px;
      border-radius: 6px;
      transition: color 0.12s;
    }
    #settings-close:hover { color: #e0e0e0; }

    .s-label {
      font-size: 0.65rem;
      font-weight: 700;
      color: #556;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }
    .s-section { margin-bottom: 20px; }

    .token-wrap { position: relative; }
    .token-wrap .s-input { padding-right: 38px; }
    #token-toggle {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #445;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0;
      line-height: 1;
      transition: color 0.12s;
    }
    #token-toggle:hover { color: #00d4aa; }

    /* ── Org row with Load button ── */
    .org-row { display: flex; gap: 6px; }
    .org-row .s-input { flex: 1; }
    .load-repos-btn {
      background: rgba(0,212,170,0.1);
      border: 1px solid rgba(0,212,170,0.25);
      border-radius: 8px;
      color: #00d4aa;
      font-size: 1rem;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.12s;
      flex-shrink: 0;
      padding: 0;
    }
    .load-repos-btn:hover   { background: rgba(0,212,170,0.2); }
    .load-repos-btn:disabled { opacity: 0.4; pointer-events: none; }
    .load-repos-btn .spin   { display: inline-block; animation: spin 0.7s linear infinite; }
    #repo-load-err {
      font-size: 0.65rem;
      color: #ff6b6b;
      margin-top: 5px;
      min-height: 0;
    }

    /* ── Repo browser ── */
    #repo-search { margin-bottom: 6px; }
    #repo-browser-list {
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      background: rgba(0,0,0,0.18);
      max-height: 200px;
      overflow-y: auto;
    }
    #repo-browser-list::-webkit-scrollbar { width: 4px; }
    #repo-browser-list::-webkit-scrollbar-track { background: transparent; }
    #repo-browser-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .repo-item { border-bottom: 1px solid rgba(255,255,255,0.04); }
    .repo-item:last-child { border-bottom: none; }
    .repo-item-hdr {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }
    .repo-item-hdr:hover { background: rgba(255,255,255,0.04); }
    .ritem-arrow {
      font-size: 0.55rem;
      color: #3a3a5a;
      width: 10px;
      flex-shrink: 0;
      transition: color 0.12s;
      line-height: 1;
    }
    .repo-item-hdr:hover .ritem-arrow { color: #00d4aa; }
    .ritem-name {
      font-size: 0.72rem;
      color: #aaa;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .repo-wf-list { padding: 0 8px 6px 26px; }
    .wf-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 2px;
    }
    .wf-name {
      font-size: 0.68rem;
      color: #667;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .wf-add-btn {
      background: rgba(0,212,170,0.08);
      border: 1px solid rgba(0,212,170,0.22);
      border-radius: 5px;
      color: #00d4aa;
      font-size: 0.65rem;
      font-weight: 700;
      font-family: inherit;
      padding: 2px 7px;
      cursor: pointer;
      flex-shrink: 0;
      line-height: 1.4;
      transition: background 0.1s;
    }
    .wf-add-btn:hover  { background: rgba(0,212,170,0.2); }
    .wf-add-btn.added  {
      background: transparent;
      border-color: rgba(255,255,255,0.07);
      color: #3a5a4a;
      cursor: default;
    }
    .ritem-loading { font-size: 0.65rem; color: #445; padding: 6px 2px; }
    .ritem-empty   { font-size: 0.65rem; color: #334; padding: 6px 2px; }
    .ritem-err     { font-size: 0.65rem; color: #ff6b6b; padding: 6px 2px; }

    /* ── Monitoring pills ── */
    #repos-list { display: flex; flex-direction: column; gap: 5px; }
    .monitoring-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
    }
    .pill-label {
      font-size: 0.72rem;
      color: #aaa;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pill-label strong {
      color: #8ab8ff;
      font-weight: 600;
    }
    .pill-remove {
      background: none;
      border: none;
      color: #334;
      cursor: pointer;
      font-size: 0.65rem;
      padding: 0 2px;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.12s;
    }
    .pill-remove:hover { color: #ff4757; }
    #monitoring-empty {
      font-size: 0.68rem;
      color: #334;
      padding: 6px 2px;
    }

    .s-input {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      color: #ccc;
      font-size: 0.72rem;
      font-family: inherit;
      padding: 7px 10px;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
    }
    .s-input:focus { border-color: rgba(0,212,170,0.45); }
    .s-input::placeholder { color: #334; }

    #settings-save {
      width: 100%;
      background: rgba(0,212,170,0.12);
      border: 1px solid rgba(0,212,170,0.3);
      border-radius: 10px;
      color: #00d4aa;
      font-size: 0.75rem;
      font-weight: 800;
      font-family: inherit;
      padding: 9px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.15s;
      margin-top: 4px;
    }
    #settings-save:hover  { background: rgba(0,212,170,0.22); }
    #settings-save:active { transform: scale(0.98); }

  </style>
</head>
<body>

  <div id="top-controls">
    <div id="interval-ctrl">
      <div id="interval-options">
        <span class="iopt"        data-s="10"  onclick="setRefresh(10)">10s</span>
        <span class="iopt"        data-s="20"  onclick="setRefresh(20)">20s</span>
        <span class="iopt"        data-s="30"  onclick="setRefresh(30)">30s</span>
        <span class="iopt"        data-s="40"  onclick="setRefresh(40)">40s</span>
        <span class="iopt"        data-s="50"  onclick="setRefresh(50)">50s</span>
        <span class="iopt active"  data-s="60"  onclick="setRefresh(60)">1m</span>
        <span class="iopt"        data-s="90"  onclick="setRefresh(90)">90s</span>
        <span class="iopt"        data-s="120" onclick="setRefresh(120)">2m</span>
      </div>
      <span id="interval-trigger" onclick="togglePicker()">1m</span>
    </div>
    <button id="refresh-btn" onclick="fetchAll()" title="Refresh now"><span class="ri">↻</span></button>
    <button id="settings-btn" onclick="openSettings()" title="Settings">⚙</button>
  </div>

  <div id="settings-overlay" onclick="overlayClick(event)">
    <div id="settings-panel">
      <div id="settings-header">
        <span>Settings</span>
        <button id="settings-close" onclick="closeSettings()">✕</button>
      </div>

      <div class="s-section">
        <label class="s-label">GitHub Token</label>
        <div class="token-wrap">
          <input id="s-token" type="password" class="s-input" placeholder="ghp_…" spellcheck="false">
          <button id="token-toggle" onclick="toggleTokenVis()" title="Show/hide">👁</button>
        </div>
      </div>

      <div class="s-section">
        <label class="s-label">Organization / Username</label>
        <div class="org-row">
          <input id="s-org" class="s-input" placeholder="your-github-org" spellcheck="false">
          <button id="load-repos-btn" class="load-repos-btn" title="Load repositories">↻</button>
        </div>
        <div id="repo-load-err"></div>
      </div>

      <div class="s-section" id="repo-browser-section" style="display:none">
        <label class="s-label">Available Repositories</label>
        <input id="repo-search" class="s-input" placeholder="Search repos…" spellcheck="false">
        <div id="repo-browser-list"></div>
      </div>

      <div class="s-section">
        <label class="s-label" id="monitoring-label">Monitoring</label>
        <div id="repos-list"></div>
        <div id="monitoring-empty" style="display:none">No repos selected — expand a repo above and click +</div>
      </div>

      <button id="settings-save" onclick="saveSettings()">Save &amp; Refresh</button>
    </div>
  </div>

  <div id="mood-header">
    <span id="stats-pill">Fetching builds…</span>
    <span id="mood-emoji">⏳</span>
    <span id="mood-label">Loading…</span>
  </div>

  <div id="stats-bar">
    <div id="motivational-msg"></div>
  </div>

  <div id="cards"></div>

  <div id="footer">
    <span id="last-refreshed">—</span>
  </div>

  <script>
    let REPOS = [];
    let refreshInterval = 60_000;
    let refreshTimer    = null;
    const MSG_ROTATE_MS = 9_000;

    const MOODS = [
      {
        min: 0.90, emoji: '🚀', label: 'Shipping mode',
        msgs: [
          'Zero issues. You\'re basically DevOps gods.',
          'Green across the board — absolute legends!',
          'The pipeline loves you and honestly, same.',
          'Ship it. Ship it again. Ship it harder.',
        ]
      },
      {
        min: 0.70, emoji: '😎', label: 'Looking solid',
        msgs: [
          'Solid work — keep that momentum!',
          'The pipeline approves of your life choices.',
          'Almost perfect. Perfection is overrated anyway.',
          'Cruising altitude. Stay sharp.',
        ]
      },
      {
        min: 0.45, emoji: '😤', label: 'Fighting through',
        msgs: [
          'A few bumps but the mission continues.',
          'Failures are just data. Fix and ship!',
          'Some reds? Debug mode: activated.',
          'The pipeline wants to be fixed. It believes in you.',
        ]
      },
      {
        min: 0.20, emoji: '😰', label: 'Needs some love',
        msgs: [
          'The pipeline needs some TLC today.',
          'Every failure is a lesson. Time to learn fast.',
          'CI is having a moment. You\'ve got this.',
          'Breathe. Revert if you must. Regroup.',
        ]
      },
      {
        min: 0, emoji: '💀', label: 'Red alert',
        msgs: [
          'Okay, we\'ve seen worse… probably.',
          'Red builds build character. Or so they say.',
          'git bisect is your friend right now.',
          'The pipeline is crying. Show it some love.',
        ]
      },
    ];

    let allRuns = {};
    let msgState = { mood: null, idx: 0 };
    let msgTimer = null;
    let lastMoodEmoji = null;
    const wfIdCache = {};

    // ── Repo browser state ──────────────────────────────────────────────────
    let allRepos = [];
    let lastLoadedOrg = '';
    const repoWorkflows = {};

    // ── Open PR cache (for automerge toggles) ───────────────────────────────
    const openPRsCache = {};
    const mergedPRs    = new Set();

    function getToken() { return localStorage.getItem('gh_token') || ''; }
    function getOrg()   { return localStorage.getItem('gh_org') || ''; }
    function getRepos() {
      try { const s = localStorage.getItem('gh_repos'); if (s) return JSON.parse(s); } catch(e) {}
      return [];
    }

    async function ghFetch(path) {
      const res = await fetch(`https://api.github.com${path}`, {
        headers: { Authorization: `Bearer ${getToken()}`, Accept: 'application/vnd.github+json' }
      });
      if (!res.ok) throw new Error(`${res.status}`);
      return res.json();
    }

    async function findWorkflowId(repo, workflowName) {
      const key = `${repo}:${workflowName}`;
      if (wfIdCache[key]) return wfIdCache[key];
      const data = await ghFetch(`/repos/${getOrg()}/${repo}/actions/workflows?per_page=100`);
      const wf = data.workflows.find(w => w.name === workflowName);
      if (wf) wfIdCache[key] = wf.id;
      return wf ? wf.id : null;
    }

    async function fetchOpenPRs(repo) {
      if (openPRsCache[repo]) return openPRsCache[repo];
      try {
        const data = await ghFetch(`/repos/${getOrg()}/${repo}/pulls?state=open&per_page=100`);
        openPRsCache[repo] = data;
        return data;
      } catch(e) {
        return [];
      }
    }

    async function mergePR(pr, btn, repo) {
      btn.disabled = true;
      btn.textContent = '…';
      try {
        const res = await fetch(`https://api.github.com/repos/${getOrg()}/${repo}/pulls/${pr.number}/merge`, {
          method: 'PUT',
          headers: { Authorization: `Bearer ${getToken()}`, 'Content-Type': 'application/json', Accept: 'application/vnd.github+json' },
          body: JSON.stringify({ merge_method: 'squash' }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          // 405 = already merged / not mergeable — treat as success
          if (res.status === 405) {
            markMerged(pr, btn, repo);
            return;
          }
          throw new Error(body.message || res.status);
        }
        markMerged(pr, btn, repo);
      } catch(e) {
        btn.disabled = false;
        btn.textContent = 'Merge';
        btn.title = `Error: ${e.message}`;
      }
    }

    function markMerged(pr, btn, repo) {
      mergedPRs.add(pr.number);
      delete openPRsCache[repo];
      btn.className   = 'merge-btn merged';
      btn.textContent = 'Merged ✓';
      btn.disabled    = true;
    }

    async function toggleAutoMerge(pr, btn, repo) {
      const enabling = pr.auto_merge === null;
      btn.disabled = true;

      const query = enabling
        ? `mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:MERGE}){pullRequest{number}}}`
        : `mutation($id:ID!){disablePullRequestAutoMerge(input:{pullRequestId:$id}){pullRequest{number}}}`;

      try {
        const res = await fetch('https://api.github.com/graphql', {
          method: 'POST',
          headers: { Authorization: `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, variables: { id: pr.node_id } }),
        });
        const json = await res.json();
        if (json.errors?.length) throw new Error(json.errors[0].message);

        // Optimistically update button and invalidate cache
        pr.auto_merge = enabling ? {} : null;
        delete openPRsCache[repo];
        btn.className = enabling ? 'automerge-btn am-on' : 'automerge-btn am-off';
        btn.textContent = enabling ? 'AUTO ●' : 'AUTO ○';
      } catch(e) {
        btn.title = `Error: ${e.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    function runSt(run) {
      const s = run.status, c = run.conclusion;
      if (s === 'in_progress' || s === 'queued' || s === 'waiting') return 'running';
      if (c === 'success')  return 'success';
      if (c === 'failure')  return 'failure';
      return 'other';
    }

    function timeAgo(d) {
      const s = (Date.now() - new Date(d)) / 1000;
      if (s < 60)    return `${Math.round(s)}s ago`;
      if (s < 3600)  return `${Math.round(s/60)}m ago`;
      if (s < 86400) return `${Math.round(s/3600)}h ago`;
      return `${Math.round(s/86400)}d ago`;
    }

    function isToday(d) {
      const x = new Date(d), n = new Date();
      return x.getFullYear() === n.getFullYear() && x.getMonth() === n.getMonth() && x.getDate() === n.getDate();
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatDuration(run) {
      if (!run.run_started_at || !run.updated_at || run.status !== 'completed') return null;
      const secs = Math.round((new Date(run.updated_at) - new Date(run.run_started_at)) / 1000);
      const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
      if (h > 0) return `${h}h ${m}m ${s}s`;
      if (m > 0) return `${m}m ${s}s`;
      return `${s}s`;
    }

    function formatDateTime(dateStr) {
      const d = new Date(dateStr), n = new Date();
      const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
      if (d.toDateString() === n.toDateString()) return `Today at ${time}`;
      const yest = new Date(n); yest.setDate(n.getDate() - 1);
      if (d.toDateString() === yest.toDateString()) return `Yesterday at ${time}`;
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ` at ${time}`;
    }

    function triggerText(run) {
      const sha   = (run.head_sha || '').slice(0, 7);
      const actor = run.triggering_actor?.login || run.actor?.login || '';
      switch (run.event) {
        case 'push':              return `Commit ${sha} pushed by ${actor}`;
        case 'pull_request':
        case 'pull_request_target': return `Pull request by ${actor}`;
        case 'workflow_dispatch': return `Manual run by ${actor}`;
        case 'schedule':          return 'Scheduled run';
        default:                  return actor ? `Triggered by ${actor}` : run.event;
      }
    }

    function calcMood(runs) {
      const done = runs.filter(r => r.conclusion);
      if (!done.length) return MOODS[2];
      const rate = done.filter(r => r.conclusion === 'success').length / done.length;
      return MOODS.find(m => rate >= m.min) || MOODS[MOODS.length - 1];
    }

    function updateMoodAndStats() {
      const flat = Object.values(allRuns).flat();
      if (!flat.length) return;

      const mood = calcMood(flat);

      const emojiEl = document.getElementById('mood-emoji');
      if (mood.emoji !== lastMoodEmoji) {
        emojiEl.classList.remove('pop');
        emojiEl.classList.add('pop');
        lastMoodEmoji = mood.emoji;
      }
      emojiEl.textContent = mood.emoji;
      document.getElementById('mood-label').textContent = mood.label;

      const todayAll = flat.filter(r => isToday(r.created_at));
      const todayOk  = todayAll.filter(r => r.conclusion === 'success').length;
      const pill = document.getElementById('stats-pill');
      pill.textContent = todayAll.length === 0
        ? 'No builds today yet'
        : `${todayOk} / ${todayAll.length} builds passing today`;

      if (msgState.mood !== mood) {
        msgState.mood = mood;
        msgState.idx  = 0;
        if (msgTimer) clearInterval(msgTimer);
        showMsg(mood, 0);
        msgTimer = setInterval(() => {
          msgState.idx = (msgState.idx + 1) % mood.msgs.length;
          showMsg(mood, msgState.idx);
        }, MSG_ROTATE_MS);
      }
    }

    function showMsg(mood, idx) {
      const el = document.getElementById('motivational-msg');
      el.classList.remove('entering');
      el.textContent = mood.msgs[idx];
      el.classList.add('entering');
    }

    async function fetchRepo({ name: repo, workflow: workflowName }) {
      const card      = document.getElementById(`card-${repo}`);
      const subEl     = card.querySelector('.card-subtitle');
      const firstLoad = !card.dataset.loaded;

      subEl.textContent = workflowName;

      if (firstLoad) {
        while (subEl.nextSibling) subEl.nextSibling.remove();
        for (let i = 0; i < 5; i++) {
          const sk = document.createElement('div'); sk.className = 'skeleton';
          card.appendChild(sk);
        }
      }

      try {
        const wfId = await findWorkflowId(repo, workflowName);
        if (!wfId) {
          while (subEl.nextSibling) subEl.nextSibling.remove();
          subEl.insertAdjacentHTML('afterend', `<div class="err">Workflow "${workflowName}" not found</div>`);
          return;
        }

        const [data, openPRs] = await Promise.all([
          ghFetch(`/repos/${getOrg()}/${repo}/actions/workflows/${wfId}/runs?per_page=5`),
          fetchOpenPRs(repo),
        ]);
        const runs = data.workflow_runs;
        allRuns[repo] = runs;
        card.dataset.loaded = '1';

        while (subEl.nextSibling) subEl.nextSibling.remove();

        if (!runs.length) {
          subEl.insertAdjacentHTML('afterend', `<div class="err">No runs found</div>`);
          return;
        }

        const prByBranch = {};
        openPRs
          .filter(pr => !mergedPRs.has(pr.number))
          .forEach(pr => { prByBranch[pr.head.ref] = pr; });

        const makeRunRow = run => {
          const st  = runSt(run);
          const pr  = prByBranch[run.head_branch] || null;
          const a   = document.createElement('a');
          a.className = `run-row ${st}`;
          a.href      = run.html_url;
          a.target    = '_blank';
          a.rel       = 'noopener';
          const title    = escHtml(run.display_title || run.head_commit?.message?.split('\n')[0] || `Run #${run.run_number}`);
          const trigger  = escHtml(triggerText(run));
          const dur      = formatDuration(run);
          const dateTime = formatDateTime(run.created_at);
          const meta     = `${escHtml(run.head_branch)} &middot; ${dateTime}${dur ? ` &middot; ${dur}` : ''}`;
          a.innerHTML = `
            <div class="dot ${st}"></div>
            <div class="run-info">
              <span class="run-title">${title}</span>
              <span class="run-trigger">${escHtml(workflowName)} #${run.run_number} &middot; ${trigger}</span>
              <span class="run-meta">${meta}</span>
            </div>`;
          if (pr) {
            const btn = document.createElement('button');
            if (run.conclusion === 'success') {
              btn.className   = 'merge-btn';
              btn.textContent = 'Merge';
              btn.title       = `Squash and merge PR #${pr.number}`;
              btn.addEventListener('click', e => { e.preventDefault(); mergePR(pr, btn, repo); });
            } else {
              const isOn = pr.auto_merge !== null;
              btn.className   = isOn ? 'automerge-btn am-on' : 'automerge-btn am-off';
              btn.textContent = isOn ? 'AUTO ●' : 'AUTO ○';
              btn.title       = isOn ? 'Automerge enabled — click to disable' : 'Click to enable automerge';
              btn.addEventListener('click', e => { e.preventDefault(); toggleAutoMerge(pr, btn, repo); });
            }
            a.appendChild(btn);
          }
          return a;
        };

        const todayRuns = runs.filter(r => isToday(r.created_at));
        const pastRuns  = runs.filter(r => !isToday(r.created_at));

        if (todayRuns.length === 0) {
          const msg = document.createElement('div');
          msg.className = 'no-today-msg';
          msg.textContent = '0 runs today';
          card.appendChild(msg);
        } else {
          todayRuns.forEach(run => card.appendChild(makeRunRow(run)));
        }

        if (pastRuns.length) {
          const sep = document.createElement('div');
          sep.className = 'date-sep';
          sep.innerHTML = '<span>Earlier</span>';
          card.appendChild(sep);
          pastRuns.forEach(run => card.appendChild(makeRunRow(run)));
        }

      } catch (e) {
        while (subEl.nextSibling) subEl.nextSibling.remove();
        subEl.insertAdjacentHTML('afterend', `<div class="err">Error ${e.message}</div>`);
      }
    }

    async function fetchAll() {
      if (!REPOS.length) return;
      const btn  = document.getElementById('refresh-btn');
      const tsEl = document.getElementById('last-refreshed');

      btn.classList.add('loading');
      btn.classList.remove('done');
      tsEl.classList.remove('done');

      await Promise.all(REPOS.map(r => fetchRepo(r)));
      updateMoodAndStats();
      tsEl.textContent = `Updated ${new Date().toLocaleTimeString()}`;

      btn.classList.remove('loading');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        btn.classList.add('done');
        tsEl.classList.add('done');
        btn.addEventListener('animationend',  () => btn.classList.remove('done'),  { once: true });
        tsEl.addEventListener('animationend', () => tsEl.classList.remove('done'), { once: true });
      }));
    }

    // ── Settings: repo browser ──────────────────────────────────────────────

    async function loadReposForSettings() {
      const token = document.getElementById('s-token').value.trim();
      const org   = document.getElementById('s-org').value.trim();
      if (!token || !org) return;

      const btn = document.getElementById('load-repos-btn');
      const err = document.getElementById('repo-load-err');
      btn.disabled = true;
      btn.innerHTML = '<span class="spin">↻</span>';
      err.textContent = '';

      if (org !== lastLoadedOrg) {
        allRepos = [];
        Object.keys(repoWorkflows).forEach(k => delete repoWorkflows[k]);
        lastLoadedOrg = org;
      }

      const headers = { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' };

      try {
        let list;
        const orgRes = await fetch(
          `https://api.github.com/orgs/${encodeURIComponent(org)}/repos?per_page=100&sort=updated`,
          { headers }
        );
        if (orgRes.ok) {
          list = await orgRes.json();
        } else {
          const userRes = await fetch(
            `https://api.github.com/users/${encodeURIComponent(org)}/repos?per_page=100&sort=updated`,
            { headers }
          );
          if (!userRes.ok) throw new Error(userRes.status);
          list = await userRes.json();
        }

        allRepos = list.map(r => r.name).sort((a, b) => a.localeCompare(b));
        document.getElementById('repo-browser-section').style.display = '';
        document.getElementById('repo-search').value = '';
        renderRepoBrowser('');
      } catch(e) {
        err.textContent = `Could not load repos (${e.message})`;
      } finally {
        btn.disabled = false;
        btn.textContent = '↻';
      }
    }

    function renderRepoBrowser(search) {
      const q = (search || '').toLowerCase();
      const filtered = q ? allRepos.filter(n => n.toLowerCase().includes(q)) : allRepos;
      const list = document.getElementById('repo-browser-list');
      list.innerHTML = '';

      if (!filtered.length) {
        list.innerHTML = '<div class="ritem-empty" style="padding:10px 12px">No repos match</div>';
        return;
      }

      filtered.forEach(name => {
        const item = document.createElement('div');
        item.className = 'repo-item';
        item.dataset.name = name;

        const hdr = document.createElement('div');
        hdr.className = 'repo-item-hdr';
        hdr.innerHTML = `<span class="ritem-arrow">▶</span><span class="ritem-name">${escHtml(name)}</span>`;

        const wfList = document.createElement('div');
        wfList.className = 'repo-wf-list';
        wfList.style.display = 'none';

        hdr.addEventListener('click', () => toggleRepoExpand(item));
        item.appendChild(hdr);
        item.appendChild(wfList);
        list.appendChild(item);
      });
    }

    async function toggleRepoExpand(item) {
      const name   = item.dataset.name;
      const wfList = item.querySelector('.repo-wf-list');
      const arrow  = item.querySelector('.ritem-arrow');

      if (wfList.style.display !== 'none') {
        wfList.style.display = 'none';
        arrow.textContent = '▶';
        return;
      }

      wfList.style.display = '';
      arrow.textContent = '▼';

      if (repoWorkflows[name] !== undefined) {
        renderWorkflows(item, repoWorkflows[name]);
        return;
      }

      wfList.innerHTML = '<div class="ritem-loading">loading…</div>';

      const token = document.getElementById('s-token').value.trim();
      const org   = document.getElementById('s-org').value.trim();

      try {
        const res = await fetch(
          `https://api.github.com/repos/${encodeURIComponent(org)}/${encodeURIComponent(name)}/actions/workflows?per_page=100`,
          { headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' } }
        );
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        repoWorkflows[name] = data.workflows;
        renderWorkflows(item, data.workflows);
      } catch(e) {
        wfList.innerHTML = `<div class="ritem-err">Error (${e.message})</div>`;
      }
    }

    function getMonitoringKeys() {
      const keys = new Set();
      document.querySelectorAll('#repos-list .monitoring-pill').forEach(p =>
        keys.add(`${p.dataset.repo}::${p.dataset.workflow}`)
      );
      return keys;
    }

    function renderWorkflows(item, workflows) {
      const repoName = item.dataset.name;
      const wfList   = item.querySelector('.repo-wf-list');

      if (!workflows || !workflows.length) {
        wfList.innerHTML = '<div class="ritem-empty">No workflows found</div>';
        return;
      }

      const monitoring = getMonitoringKeys();
      wfList.innerHTML = '';

      workflows.forEach(wf => {
        const isAdded = monitoring.has(`${repoName}::${wf.name}`);
        const row  = document.createElement('div');
        row.className = 'wf-item';

        const nameEl = document.createElement('span');
        nameEl.className = 'wf-name';
        nameEl.textContent = wf.name;

        const btn = document.createElement('button');
        btn.className = isAdded ? 'wf-add-btn added' : 'wf-add-btn';
        btn.textContent = isAdded ? '✓' : '+';
        btn.disabled = isAdded;
        btn.dataset.wf = wf.name;

        if (!isAdded) {
          btn.addEventListener('click', () => addToMonitoring(repoName, wf.name, btn));
        }

        row.appendChild(nameEl);
        row.appendChild(btn);
        wfList.appendChild(row);
      });
    }

    function addToMonitoring(repoName, workflowName, btn) {
      if (btn) {
        btn.className = 'wf-add-btn added';
        btn.textContent = '✓';
        btn.disabled = true;
      }

      const list = document.getElementById('repos-list');
      const pill = document.createElement('div');
      pill.className = 'monitoring-pill';
      pill.dataset.repo     = repoName;
      pill.dataset.workflow = workflowName;

      const label = document.createElement('span');
      label.className = 'pill-label';
      label.innerHTML = `<strong>${escHtml(repoName)}</strong> · ${escHtml(workflowName)}`;

      const rmBtn = document.createElement('button');
      rmBtn.className = 'pill-remove';
      rmBtn.textContent = '✕';
      rmBtn.addEventListener('click', () => removeFromMonitoring(pill, repoName, workflowName));

      pill.appendChild(label);
      pill.appendChild(rmBtn);
      list.appendChild(pill);
      updateMonitoringState();
    }

    function removeFromMonitoring(pill, repoName, workflowName) {
      pill.remove();
      updateMonitoringState();

      // Re-render the repo's workflow list if it's currently expanded and cached
      const repoItem = document.querySelector(`#repo-browser-list .repo-item[data-name="${CSS.escape(repoName)}"]`);
      if (repoItem && repoWorkflows[repoName] !== undefined) {
        const wfList = repoItem.querySelector('.repo-wf-list');
        if (wfList && wfList.style.display !== 'none') {
          renderWorkflows(repoItem, repoWorkflows[repoName]);
        }
      }
    }

    function updateMonitoringState() {
      const count = document.querySelectorAll('#repos-list .monitoring-pill').length;
      document.getElementById('monitoring-label').textContent =
        count ? `Monitoring (${count})` : 'Monitoring';
      document.getElementById('monitoring-empty').style.display = count ? 'none' : '';
    }

    // ── Settings panel ─────────────────────────────────────────────────────

    function openSettings() {
      document.getElementById('s-token').value = getToken();
      document.getElementById('s-org').value   = getOrg();
      document.getElementById('repo-load-err').textContent = '';

      const list = document.getElementById('repos-list');
      list.innerHTML = '';
      getRepos().forEach(r => addToMonitoring(r.name, r.workflow, null));
      updateMonitoringState();

      if (allRepos.length) {
        document.getElementById('repo-browser-section').style.display = '';
        renderRepoBrowser(document.getElementById('repo-search').value);
      } else {
        document.getElementById('repo-browser-section').style.display = 'none';
      }

      document.getElementById('settings-overlay').classList.add('open');
    }

    function closeSettings() {
      document.getElementById('settings-overlay').classList.remove('open');
    }

    function overlayClick(e) {
      if (e.target === document.getElementById('settings-overlay')) closeSettings();
    }

    function toggleTokenVis() {
      const inp = document.getElementById('s-token');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    function rebuildCards() {
      const container = document.getElementById('cards');
      container.innerHTML = REPOS.map(r => `
        <div class="card" id="card-${r.name}">
          <div class="card-title">${escHtml(r.name)}</div>
          <div class="card-subtitle">${escHtml(r.workflow)}</div>
          <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        </div>`).join('');
    }

    function saveSettings() {
      const token = document.getElementById('s-token').value.trim();
      const org   = document.getElementById('s-org').value.trim();
      if (token) localStorage.setItem('gh_token', token);
      if (org)   localStorage.setItem('gh_org', org);

      const newRepos = [];
      document.querySelectorAll('#repos-list .monitoring-pill').forEach(pill => {
        newRepos.push({ name: pill.dataset.repo, workflow: pill.dataset.workflow });
      });
      if (newRepos.length) {
        REPOS = newRepos;
        localStorage.setItem('gh_repos', JSON.stringify(REPOS));
      }

      Object.keys(wfIdCache).forEach(k => delete wfIdCache[k]);
      Object.keys(openPRsCache).forEach(k => delete openPRsCache[k]);
      allRuns = {};
      closeSettings();
      rebuildCards();
      fetchAll();
    }

    // ── Interval picker ────────────────────────────────────────────────────

    function togglePicker() {
      document.getElementById('interval-options').classList.toggle('open');
    }

    function setRefresh(secs) {
      refreshInterval = secs * 1000;
      clearInterval(refreshTimer);
      refreshTimer = setInterval(fetchAll, refreshInterval);
      const label = secs < 60 ? `${secs}s` : secs === 90 ? '90s' : '2m';
      document.getElementById('interval-trigger').textContent = label;
      document.querySelectorAll('.iopt').forEach(el =>
        el.classList.toggle('active', +el.dataset.s === secs)
      );
      document.getElementById('interval-options').classList.remove('open');
    }

    document.addEventListener('click', e => {
      if (!document.getElementById('interval-ctrl').contains(e.target))
        document.getElementById('interval-options').classList.remove('open');
    });

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSettings(); });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearInterval(refreshTimer);
        refreshTimer = null;
      } else if (REPOS.length) {
        fetchAll();
        refreshTimer = setInterval(fetchAll, refreshInterval);
      }
    });

    document.getElementById('load-repos-btn').addEventListener('click', loadReposForSettings);
    document.getElementById('repo-search').addEventListener('input', e => renderRepoBrowser(e.target.value));

    // ── Init ───────────────────────────────────────────────────────────────

    async function init() {
      REPOS = getRepos();
      if (!getToken() || !getOrg() || !REPOS.length) {
        openSettings();
        return;
      }
      rebuildCards();
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
      fetchAll();
      refreshTimer = setInterval(fetchAll, refreshInterval);
    }

    init();
  </script>
</body>
</html>
