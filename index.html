<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub PR Status</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes btnFlash {
      0%   { background: rgba(0,212,170,0.35); border-color: rgba(0,212,170,0.7); }
      100% { background: rgba(0,212,170,0.1);  border-color: rgba(0,212,170,0.25); }
    }
    @keyframes tsFlash {
      0%   { color: #00d4aa; letter-spacing: 0.04em; }
      60%  { color: #00d4aa; letter-spacing: 0; }
      100% { color: #3a3a4a; letter-spacing: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1;   }
      50%       { opacity: 0.4; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes emojiPop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.25); }
      70%  { transform: scale(0.95); }
      100% { transform: scale(1); }
    }
    @keyframes msgFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background: #151c2e;
      min-height: 100vh;
      color: #e0e0e0;
      padding: 22px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(135deg, #151c2e 0%, #1b2a40 30%, #0f3636 55%, #153030 75%, #1a2030 100%);
    }

    /* ── Mood header ── */
    #mood-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      animation: fadeInUp 0.5s ease both;
      flex-wrap: wrap;
    }
    #mood-emoji {
      font-size: 3.8rem;
      line-height: 1;
      filter: drop-shadow(0 0 14px rgba(0, 212, 170, 0.5));
    }
    #mood-emoji.pop { animation: emojiPop 0.45s cubic-bezier(.36,.07,.19,.97) both; }
    #mood-label {
      font-size: 0.9rem;
      font-weight: 800;
      color: #00d4aa;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    #stats-pill {
      font-size: 0.85rem;
      color: #7ecfb8;
      font-weight: 600;
    }

    /* ── Mantra ── */
    #stats-bar {
      text-align: center;
      animation: fadeInUp 0.5s ease 0.1s both;
      margin-bottom: 10px;
    }
    #motivational-msg {
      font-size: 1rem;
      color: #667;
      font-style: italic;
      min-height: 1.2em;
    }
    #motivational-msg.entering { animation: msgFadeIn 0.45s ease both; }

    /* ── Cards grid ── */
    #cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      align-content: start;
      animation: fadeInUp 0.5s ease 0.2s both;
    }
    .card {
      background: rgba(22, 30, 48, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 14px;
      min-width: 0;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .card:hover {
      border-color: rgba(0, 212, 170, 0.28);
      box-shadow: 0 0 24px rgba(0, 212, 170, 0.07);
    }
    .card-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: #8ab8ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 1px;
    }
    .card-subtitle {
      font-size: 0.64rem;
      color: #445;
      margin-bottom: 10px;
    }

    /* ── PR rows ── */
    .pr-row {
      border-left: 3px solid transparent;
      border-radius: 8px;
      margin-bottom: 3px;
      transition: border-color 0.3s;
    }
    .pr-row.success { border-left-color: #00d4aa; }
    .pr-row.failure { border-left-color: #ff4757; }
    .pr-row.running { border-left-color: #ffd43b; }
    .pr-row.other   { border-left-color: #3a3a4a; }
    .pr-row.merged  { border-left-color: rgba(130,80,223,0.5); opacity: 0.75; }

    .pr-row-hdr {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 6px 7px;
    }
    .pr-toggle {
      background: none;
      border: none;
      color: #3a3a5a;
      cursor: pointer;
      font-size: 0.55rem;
      padding: 3px 1px 0;
      flex-shrink: 0;
      line-height: 1;
      transition: color 0.12s;
    }
    .pr-toggle:hover { color: #00d4aa; }

    .pr-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .pr-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: #d0d0d0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-decoration: none;
    }
    .pr-title:hover { color: #8ab8ff; text-decoration: underline; }
    .pr-meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }
    .wf-dots {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .wf-section-label {
      font-size: 0.58rem;
      color: #3a3a5a;
    }
    .wf-dot-item {
      display: flex;
      align-items: center;
      gap: 2px;
      cursor: default;
    }
    .wf-dot-label {
      font-size: 0.57rem;
      color: #445;
      max-width: 54px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Dots ── */
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.success { background: #00d4aa; box-shadow: 0 0 5px rgba(0,212,170,0.5); }
    .dot.failure { background: #ff4757; box-shadow: 0 0 7px rgba(255,71,87,0.6); }
    .dot.running { background: #ffd43b; animation: pulse 1.4s ease-in-out infinite; }
    .dot.other   { background: #3a3a4a; }

    /* ── Merged / Draft badges ── */
    .merged-badge {
      font-size: 0.58rem;
      font-weight: 700;
      color: #7a5ea0;
      flex-shrink: 0;
      padding: 2px 6px;
      border: 1px solid rgba(130,80,223,0.2);
      border-radius: 5px;
      background: rgba(130,80,223,0.08);
      white-space: nowrap;
    }
/* ── No-PR separator ── */
    .no-pr-sep {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 8px 2px 4px;
      color: #2a2f3a;
      font-size: 0.55rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }
    .no-pr-sep::before, .no-pr-sep::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.04);
    }

    /* ── Expanded body ── */
    .pr-row-body {
      padding: 0 7px 8px 22px;
    }
    .pr-author-line {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 8px;
      font-size: 0.63rem;
      color: #445;
    }
    .pr-avatar {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .pr-author-name { color: #889; }

    .pr-builds-section { margin-bottom: 6px; }
    .pr-builds-label {
      font-size: 0.57rem;
      font-weight: 700;
      color: #667;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 3px;
      padding-left: 2px;
    }

    /* ── Run lines (expanded) ── */
    .run-line {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 3px 4px;
      border-radius: 6px;
      text-decoration: none;
      color: inherit;
      margin-bottom: 1px;
      transition: background 0.12s;
    }
    a.run-line:hover { background: rgba(255,255,255,0.04); }
    .run-line-info {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }
    .run-line-wf {
      font-size: 0.65rem;
      color: #667;
      flex-shrink: 0;
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .run-line-meta {
      font-size: 0.6rem;
      color: #3a3a5a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Skeleton ── */
    .skeleton {
      height: 54px;
      border-radius: 8px;
      background: linear-gradient(90deg,
        rgba(255,255,255,0.03) 25%,
        rgba(255,255,255,0.07) 50%,
        rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      margin-bottom: 2px;
    }
    .err { color: #ff6b6b; font-size: 0.72rem; padding: 4px 2px; }
    .no-prs-msg {
      font-size: 0.68rem;
      color: #445;
      padding: 4px 7px 2px;
      font-style: italic;
    }

    /* ── Automerge toggle ── */
    .automerge-btn {
      flex-shrink: 0;
      border-radius: 5px;
      font-size: 0.58rem;
      font-weight: 700;
      font-family: inherit;
      padding: 2px 6px;
      cursor: pointer;
      line-height: 1.5;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }
    .automerge-btn.am-off {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: #445;
    }
    .automerge-btn.am-off:hover  { border-color: rgba(0,212,170,0.35); color: #00d4aa; }
    .automerge-btn.am-on {
      background: rgba(0,212,170,0.12);
      border: 1px solid rgba(0,212,170,0.35);
      color: #00d4aa;
    }
    .automerge-btn.am-on:hover   { background: rgba(0,212,170,0.22); }
    .automerge-btn:disabled      { opacity: 0.4; pointer-events: none; }

    /* ── Merge button — GitHub purple ── */
    .merge-btn {
      flex-shrink: 0;
      border-radius: 5px;
      font-size: 0.58rem;
      font-weight: 700;
      font-family: inherit;
      padding: 2px 6px;
      cursor: pointer;
      line-height: 1.5;
      white-space: nowrap;
      background: rgba(130,80,223,0.15);
      border: 1px solid rgba(130,80,223,0.45);
      color: #a371f7;
      transition: background 0.15s, opacity 0.15s;
    }
    .merge-btn:hover    { background: rgba(130,80,223,0.28); }
    .merge-btn:disabled { opacity: 0.4; pointer-events: none; }

    /* ── Footer ── */
    #footer {
      text-align: right;
      font-size: 0.64rem;
      color: #3a3a4a;
      animation: fadeInUp 0.5s ease 0.3s both;
    }

    /* ── Top-right controls ── */
    #top-controls {
      position: fixed;
      top: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 10;
    }
    #refresh-btn {
      background: rgba(0,212,170,0.1);
      border: 1px solid rgba(0,212,170,0.25);
      color: #00d4aa;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s;
      padding: 0;
    }
    #refresh-btn:hover  { background: rgba(0,212,170,0.18); }
    #refresh-btn:active { transform: scale(0.92); }
    #refresh-btn.loading { pointer-events: none; opacity: 0.5; }
    #refresh-btn.loading .ri { display: inline-block; animation: spin 0.7s linear infinite; }
    #refresh-btn.done { animation: btnFlash 0.9s ease forwards; }
    #last-refreshed.done { animation: tsFlash 1.6s ease forwards; }
    .ri { line-height: 1; }

    /* ── Interval control ── */
    #interval-ctrl {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 34px;
    }
    #interval-trigger {
      font-size: 0.65rem;
      font-weight: 700;
      color: #557;
      cursor: pointer;
      user-select: none;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      transition: color 0.12s, background 0.12s;
      white-space: nowrap;
    }
    #interval-trigger:hover { color: #00d4aa; background: rgba(0,212,170,0.08); }
    #interval-options {
      display: flex;
      align-items: center;
      gap: 3px;
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
      transition: max-width 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.2s ease;
    }
    #interval-options.open { max-width: 320px; opacity: 1; pointer-events: all; }
    .iopt {
      font-size: 0.61rem;
      font-weight: 600;
      color: #3a3a5a;
      cursor: pointer;
      padding: 3px 7px;
      border-radius: 7px;
      white-space: nowrap;
      user-select: none;
      transition: color 0.12s, background 0.12s;
    }
    .iopt:hover  { color: #00d4aa; }
    .iopt.active { color: #00d4aa; background: rgba(0,212,170,0.12); }
    #settings-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.13);
      color: #99a;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: color 0.15s, background 0.15s, transform 0.4s cubic-bezier(0.4,0,0.2,1);
      padding: 0;
    }
    #settings-btn:hover { color: #00d4aa; background: rgba(0,212,170,0.1); transform: rotate(75deg); }

    /* ── Settings overlay ── */
    #settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #settings-overlay.open { opacity: 1; pointer-events: all; }

    #settings-panel {
      background: rgba(16,16,32,0.97);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 18px;
      padding: 26px 24px 22px;
      width: 440px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 64px);
      overflow-y: auto;
      transform: translateY(-14px) scale(0.97);
      transition: transform 0.22s cubic-bezier(0.4,0,0.2,1);
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }
    #settings-overlay.open #settings-panel { transform: translateY(0) scale(1); }

    #settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    #settings-header span {
      font-size: 0.85rem;
      font-weight: 800;
      color: #00d4aa;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    #settings-close {
      background: none;
      border: none;
      color: #445;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 2px 5px;
      border-radius: 6px;
      transition: color 0.12s;
    }
    #settings-close:hover { color: #e0e0e0; }

    .s-label {
      font-size: 0.65rem;
      font-weight: 700;
      color: #556;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }
    .s-section { margin-bottom: 20px; }

    .token-wrap { position: relative; }
    .token-wrap .s-input { padding-right: 38px; }
    #token-toggle {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #445;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0;
      line-height: 1;
      transition: color 0.12s;
    }
    #token-toggle:hover { color: #00d4aa; }

    .org-row { display: flex; gap: 6px; }
    .org-row .s-input { flex: 1; }
    .load-repos-btn {
      background: rgba(0,212,170,0.1);
      border: 1px solid rgba(0,212,170,0.25);
      border-radius: 8px;
      color: #00d4aa;
      font-size: 1rem;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.12s;
      flex-shrink: 0;
      padding: 0;
    }
    .load-repos-btn:hover   { background: rgba(0,212,170,0.2); }
    .load-repos-btn:disabled { opacity: 0.4; pointer-events: none; }
    .load-repos-btn .spin   { display: inline-block; animation: spin 0.7s linear infinite; }
    #repo-load-err {
      font-size: 0.65rem;
      color: #ff6b6b;
      margin-top: 5px;
      min-height: 0;
    }

    /* ── Repo browser ── */
    #repo-search { margin-bottom: 6px; }
    #repo-browser-list {
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      background: rgba(0,0,0,0.18);
      max-height: 200px;
      overflow-y: auto;
    }
    #repo-browser-list::-webkit-scrollbar { width: 4px; }
    #repo-browser-list::-webkit-scrollbar-track { background: transparent; }
    #repo-browser-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .repo-item { border-bottom: 1px solid rgba(255,255,255,0.04); }
    .repo-item:last-child { border-bottom: none; }
    .repo-item-hdr {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }
    .repo-item-hdr:hover { background: rgba(255,255,255,0.04); }
    .ritem-arrow {
      font-size: 0.55rem;
      color: #3a3a5a;
      width: 10px;
      flex-shrink: 0;
      transition: color 0.12s;
      line-height: 1;
    }
    .repo-item-hdr:hover .ritem-arrow { color: #00d4aa; }
    .ritem-name {
      font-size: 0.72rem;
      color: #aaa;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .repo-wf-list { padding: 0 8px 6px 26px; }
    .wf-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 2px;
    }
    .wf-name {
      font-size: 0.68rem;
      color: #667;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .wf-add-btn {
      background: rgba(0,212,170,0.08);
      border: 1px solid rgba(0,212,170,0.22);
      border-radius: 5px;
      color: #00d4aa;
      font-size: 0.65rem;
      font-weight: 700;
      font-family: inherit;
      padding: 2px 7px;
      cursor: pointer;
      flex-shrink: 0;
      line-height: 1.4;
      transition: background 0.1s;
    }
    .wf-add-btn:hover  { background: rgba(0,212,170,0.2); }
    .wf-add-btn.added  {
      background: transparent;
      border-color: rgba(255,255,255,0.07);
      color: #3a5a4a;
      cursor: default;
    }
    .ritem-loading { font-size: 0.65rem; color: #445; padding: 6px 2px; }
    .ritem-empty   { font-size: 0.65rem; color: #334; padding: 6px 2px; }
    .ritem-err     { font-size: 0.65rem; color: #ff6b6b; padding: 6px 2px; }

    /* ── Monitoring pills (new grouped style) ── */
    #repos-list { display: flex; flex-direction: column; gap: 5px; }
    .monitoring-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      flex-wrap: wrap;
    }
    .pill-repo-name {
      font-size: 0.72rem;
      color: #8ab8ff;
      font-weight: 600;
      flex-shrink: 0;
    }
    .pill-wf-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      flex: 1;
      min-width: 0;
    }
    .pill-wf-chip {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 0.62rem;
      color: #778;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      padding: 1px 4px 1px 6px;
    }
    .pill-wf-chip-remove {
      background: none;
      border: none;
      color: #334;
      cursor: pointer;
      font-size: 0.65rem;
      padding: 0;
      line-height: 1;
      transition: color 0.12s;
    }
    .pill-wf-chip-remove:hover { color: #ff4757; }

  <div id="top-controls">

          <input id="s-org" class="s-input" placeholder="your-github-org" spellcheck="false">

      <button id="settings-save" onclick="saveSettings()">Save &amp; Refresh</button>
    </div>
  </div>

  <div id="mood-header">
    <span id="stats-pill">Fetching PRs…</span>
    <span id="mood-emoji">⏳</span>
    <span id="mood-label">Loading…</span>
  </div>

  <div id="stats-bar">
    <div id="motivational-msg"></div>
  </div>

  <div id="cards"></div>

  <div id="footer">
    <span id="last-refreshed">—</span>
  </div>

  <script>
    let REPOS = [];
    let refreshInterval = 60_000;
    let refreshTimer    = null;
    const MSG_ROTATE_MS = 9_000;

    const MOODS = [
      {
        min: 0.90, emoji: '🚀', label: 'Shipping mode',
        msgs: [
          'Zero issues. You\'re basically DevOps gods.',
          'Green across the board — absolute legends!',
          'The pipeline loves you and honestly, same.',
          'Ship it. Ship it again. Ship it harder.',
        ]
      },
      {
        min: 0.70, emoji: '😎', label: 'Looking solid',
        msgs: [
          'Solid work — keep that momentum!',
          'The pipeline approves of your life choices.',
          'Almost perfect. Perfection is overrated anyway.',
          'Cruising altitude. Stay sharp.',
        ]
      },
      {
        min: 0.45, emoji: '😤', label: 'Fighting through',
        msgs: [
          'A few bumps but the mission continues.',
          'Failures are just data. Fix and ship!',
          'Some reds? Debug mode: activated.',
          'The pipeline wants to be fixed. It believes in you.',
        ]
      },
      {
        min: 0.20, emoji: '😰', label: 'Needs some love',
        msgs: [
          'The pipeline needs some TLC today.',
          'Every failure is a lesson. Time to learn fast.',
          'CI is having a moment. You\'ve got this.',
          'Breathe. Revert if you must. Regroup.',
        ]
      },
      {
        min: 0, emoji: '💀', label: 'Red alert',
        msgs: [
          'Okay, we\'ve seen worse… probably.',
          'Red builds build character. Or so they say.',
          'git bisect is your friend right now.',
          'The pipeline is crying. Show it some love.',
        ]
      },
    ];

    // { [repo]: [{ pr, branchRuns: {wfName: run|null}, masterRuns: {wfName: run|null}, expanded: bool }] }
    let allPRData    = {};
    // { [repo]: { wfName: [run,...] } } — main-branch runs not from any PR merge
    let allDirectRuns = {};
    let msgState = { mood: null, idx: 0 };
    let msgTimer = null;
    let lastMoodEmoji = null;
    const wfIdCache = {};
    const prCache   = {};  // { [repo]: [PR objects] } — cleared each fetchAll cycle

    // ── Repo browser state ──────────────────────────────────────────────────
    let allRepos = [];
    let lastLoadedOrg = '';
    const repoWorkflows = {};

    // ── Storage helpers ─────────────────────────────────────────────────────
    function getToken() { return localStorage.getItem('gh_token') || ''; }
    function getOrg()   { return localStorage.getItem('gh_org') || ''; }

    function getRepos() {
      try {
        const s = localStorage.getItem('gh_repos');
        if (!s) return [];
        let repos = JSON.parse(s);
        // Migrate old { name, workflow } format to { name, workflows[] }
        if (repos.length && repos[0].workflow !== undefined) {
          const byName = {};
          repos.forEach(r => {
            if (!byName[r.name]) byName[r.name] = [];
            if (r.workflow && !byName[r.name].includes(r.workflow)) byName[r.name].push(r.workflow);
          });
          repos = Object.entries(byName).map(([name, workflows]) => ({ name, workflows }));
          localStorage.setItem('gh_repos', JSON.stringify(repos));
        }
        return repos;
      } catch(e) {}
      return [];
    }

    // ── GitHub API ──────────────────────────────────────────────────────────
    async function ghFetch(path) {
      const res = await fetch(`https://api.github.com${path}`, {
        headers: { Authorization: `Bearer ${getToken()}`, Accept: 'application/vnd.github+json' }
      });
      if (!res.ok) throw new Error(`${res.status}`);
      return res.json();
    }

    async function findWorkflowId(repo, workflowName) {
      const key = `${repo}:${workflowName}`;
      if (wfIdCache[key]) return wfIdCache[key];
      const data = await ghFetch(`/repos/${getOrg()}/${repo}/actions/workflows?per_page=100`);
      const wf = data.workflows.find(w => w.name === workflowName);
      if (wf) wfIdCache[key] = wf.id;
      return wf ? wf.id : null;
    }

    async function fetchRepoPRs(repo) {
      if (prCache[repo]) return prCache[repo];
      try {
        const data = await ghFetch(
          `/repos/${getOrg()}/${repo}/pulls?state=all&per_page=100&sort=updated&direction=desc`
        );
        prCache[repo] = data;
        return data;
      } catch(e) {
        return [];
      }
    }

    // ── PR status ────────────────────────────────────────────────────────────
    function prStatus(entry) {
      const vals = Object.values(entry.branchRuns);
      if (!vals.length) return 'other';
      const sts = vals.map(r => r ? runSt(r) : 'other');
      if (sts.every(s => s === 'success')) return 'success';
      if (sts.some(s => s === 'running'))  return 'running';
      if (sts.some(s => s === 'failure'))  return 'failure';
      return 'other';
    }

    function masterStatus(entry) {
      const vals = Object.values(entry.masterRuns);
      if (!vals.length || vals.every(r => r === null)) return 'other';
      const sts = vals.map(r => r ? runSt(r) : 'other');
      if (sts.every(s => s === 'success')) return 'success';
      if (sts.some(s => s === 'running'))  return 'running';
      if (sts.some(s => s === 'failure'))  return 'failure';
      return 'other';
    }

    // ── Fetch PRs + runs for a repo ─────────────────────────────────────────
    async function fetchPRsForRepo({ name: repo, workflows: workflowNames }) {
      const card = document.getElementById(`card-${repo}`);
      if (!card) return;

      try {
        // Resolve all workflow IDs in parallel
        const wfIds = {};
        await Promise.all((workflowNames || []).map(async wfName => {
          wfIds[wfName] = await findWorkflowId(repo, wfName);
        }));

        // Fetch PR list
        const allPRs  = await fetchRepoPRs(repo);
        const cutoff  = Date.now() - 7 * 24 * 3600 * 1000;
        const prs     = allPRs.filter(pr =>
          (!pr.draft && pr.state === 'open') ||
          (pr.merged_at && new Date(pr.merged_at).getTime() > cutoff)
        );

        // Preserve expanded state from previous render
        const prevExpanded = {};
        (allPRData[repo] || []).forEach(e => { prevExpanded[e.pr.number] = e.expanded; });

        // Fetch branch runs + master runs per PR (all in parallel)
        const entries = await Promise.all(prs.map(async pr => {
          const branchRuns = {};
          const masterRuns = {};

          await Promise.all((workflowNames || []).map(async wfName => {
            const wfId = wfIds[wfName];
            if (!wfId) { branchRuns[wfName] = null; masterRuns[wfName] = null; return; }

            const branchRef = encodeURIComponent(pr.head.ref);
            const [branchData, masterData] = await Promise.all([
              ghFetch(`/repos/${getOrg()}/${repo}/actions/workflows/${wfId}/runs?branch=${branchRef}&per_page=1`)
                .catch(() => null),
              pr.merged_at && pr.merge_commit_sha
                ? ghFetch(`/repos/${getOrg()}/${repo}/actions/workflows/${wfId}/runs?head_sha=${pr.merge_commit_sha}&per_page=1`)
                    .catch(() => null)
                : Promise.resolve(null),
            ]);

            branchRuns[wfName] = branchData?.workflow_runs?.[0] || null;
            masterRuns[wfName] = masterData?.workflow_runs?.[0] || null;
          }));

          return { pr, branchRuns, masterRuns, expanded: prevExpanded[pr.number] || false };
        }));

        allPRData[repo] = entries;

        // Fetch runs not associated with any PR (any branch, not just main)
        // Use the full cached PR list (100 entries, all states) to build exclusion sets —
        // much wider coverage than the 48h-filtered `prs` subset.
        const allKnownPRs  = await fetchRepoPRs(repo);
        const prBranchRefs = new Set(allKnownPRs.map(pr => pr.head.ref));
        const mergedSHAs   = new Set(allKnownPRs.filter(pr => pr.merge_commit_sha).map(pr => pr.merge_commit_sha));
        const directMap    = {};
        await Promise.all((workflowNames || []).map(async wfName => {
          const wfId = wfIds[wfName];
          if (!wfId) { directMap[wfName] = []; return; }
          try {
            const d = await ghFetch(
              `/repos/${getOrg()}/${repo}/actions/workflows/${wfId}/runs?per_page=10`
            );
            directMap[wfName] = (d.workflow_runs || []).filter(r =>
              !prBranchRefs.has(r.head_branch) && !mergedSHAs.has(r.head_sha)
            );
          } catch(e) {
            directMap[wfName] = [];
          }
        }));
        allDirectRuns[repo] = directMap;

        renderPRCards(repo);
      } catch(e) {
        const sub = card.querySelector('.card-subtitle');
        while (sub && sub.nextSibling) sub.nextSibling.remove();
        card.insertAdjacentHTML('beforeend', `<div class="err">Error: ${escHtml(e.message)}</div>`);
      }
    }

    // ── Render PR cards ──────────────────────────────────────────────────────
    function renderPRCards(repo) {
      const card = document.getElementById(`card-${repo}`);
      if (!card) return;

      const sub = card.querySelector('.card-subtitle');
      while (sub && sub.nextSibling) sub.nextSibling.remove();

      const entries = allPRData[repo] || [];
      if (!entries.length) {
        const msg = document.createElement('div');
        msg.className = 'no-prs-msg';
        msg.textContent = 'No open PRs';
        card.appendChild(msg);
        return;
      }

      // Open PRs first (by updated_at desc), then merged PRs (by merged_at desc)
      const sorted = [...entries].sort((a, b) => {
        const aMerged = !!a.pr.merged_at, bMerged = !!b.pr.merged_at;
        if (aMerged !== bMerged) return aMerged ? 1 : -1;
        const aTime = new Date(a.pr.merged_at || a.pr.updated_at);
        const bTime = new Date(b.pr.merged_at || b.pr.updated_at);
        return bTime - aTime;
      });

      const recentCutoff = Date.now() - 48 * 3600 * 1000;
      const recent = sorted.filter(e => !e.pr.merged_at || new Date(e.pr.merged_at).getTime() > recentCutoff);
      const older  = sorted.filter(e =>  e.pr.merged_at && new Date(e.pr.merged_at).getTime() <= recentCutoff);

      recent.forEach(entry => card.appendChild(buildPRRow(repo, entry)));

      if (older.length) {
        const sep = document.createElement('div');
        sep.className = 'no-pr-sep';
        sep.innerHTML = '<span>older</span>';
        card.appendChild(sep);
        older.forEach(entry => card.appendChild(buildPRRow(repo, entry)));
      }

      // Direct main-branch runs (no associated PR)
      const directMap  = allDirectRuns[repo] || {};
      const flatDirect = Object.entries(directMap)
        .flatMap(([wfName, runs]) => runs.map(r => ({ run: r, wfName })))
        .sort((a, b) => new Date(b.run.created_at) - new Date(a.run.created_at));

      if (flatDirect.length) {
        const sep = document.createElement('div');
        sep.className = 'no-pr-sep';
        sep.innerHTML = '<span>no PR</span>';
        card.appendChild(sep);
        flatDirect.forEach(({ run, wfName }) => card.appendChild(buildDirectRunLine(run, wfName)));
      }
    }

    function buildPRRow(repo, entry) {
      const { pr, branchRuns, masterRuns } = entry;
      const isMerged = !!pr.merged_at;
      const st       = isMerged ? 'merged' : prStatus(entry);
      const wfNames  = Object.keys(branchRuns);

      const row  = document.createElement('div');
      row.className = `pr-row ${st}`;

      // ── Header ──
      const hdr = document.createElement('div');
      hdr.className = 'pr-row-hdr';

      const toggle = document.createElement('button');
      toggle.className = 'pr-toggle';
      toggle.textContent = entry.expanded ? '▼' : '▶';

      const info    = document.createElement('div');
      info.className = 'pr-info';

      const titleEl = document.createElement('a');
      titleEl.className = 'pr-title';
      titleEl.textContent = pr.title;
      titleEl.title = pr.title;
      titleEl.href   = pr.html_url;
      titleEl.target = '_blank';
      titleEl.rel    = 'noopener';

      const metaLine = document.createElement('div');
      metaLine.className = 'pr-meta-line';

      // Branch workflow dots
      const branchDots = makeDotRow('Branch:', branchRuns);
      metaLine.appendChild(branchDots);

      // Main dots (only if merged)
      if (isMerged) {
        const mainDots = makeDotRow('Main:', masterRuns);
        metaLine.appendChild(mainDots);
      }

      info.appendChild(titleEl);
      info.appendChild(metaLine);

      // Action button
      let actionEl;
      if (isMerged) {
        const badge = document.createElement('span');
        badge.className   = 'merged-badge';
        badge.textContent = 'Merged ✓';
        actionEl = badge;
      } else {
        const btn = document.createElement('button');
        if (st === 'success') {
          btn.className   = 'merge-btn';
          btn.textContent = 'Merge';
          btn.title       = `Squash and merge PR #${pr.number}`;
          btn.addEventListener('click', e => { e.preventDefault(); mergePREntry(pr, btn, repo, entry); });
        } else {
          const isOn = pr.auto_merge !== null;
          btn.className   = isOn ? 'automerge-btn am-on' : 'automerge-btn am-off';
          btn.textContent = isOn ? 'AUTO ●' : 'AUTO ○';
          btn.title       = isOn ? 'Automerge enabled — click to disable' : 'Click to enable automerge';
          btn.addEventListener('click', e => { e.preventDefault(); toggleAutoMerge(pr, btn, repo); });
        }
        actionEl = btn;
      }

      hdr.appendChild(toggle);
      hdr.appendChild(info);
      hdr.appendChild(actionEl);

      // ── Body (expanded) ──
      const body = document.createElement('div');
      body.className = 'pr-row-body';
      body.style.display = entry.expanded ? '' : 'none';

      // Author line
      const authorLine = document.createElement('div');
      authorLine.className = 'pr-author-line';
      if (pr.user?.avatar_url) {
        const img = document.createElement('img');
        img.className = 'pr-avatar';
        img.src = pr.user.avatar_url;
        img.alt = '';
        authorLine.appendChild(img);
      }
      const nameSpan = document.createElement('span');
      nameSpan.className = 'pr-author-name';
      nameSpan.textContent = pr.user?.login || '';
      const metaSpan = document.createElement('span');
      metaSpan.textContent = `· opened ${timeAgo(pr.created_at)} · #${pr.number}`;
      authorLine.appendChild(nameSpan);
      authorLine.appendChild(metaSpan);
      body.appendChild(authorLine);

      // Branch builds section
      if (wfNames.length) {
        body.appendChild(buildRunSection('Branch builds', wfNames, branchRuns));
      }

      // Main build section (always show for merged so user can track it)
      if (isMerged) {
        body.appendChild(buildRunSection('Main build (after merge)', wfNames, masterRuns));
      }

      // Toggle handler
      toggle.addEventListener('click', () => {
        entry.expanded = !entry.expanded;
        toggle.textContent = entry.expanded ? '▼' : '▶';
        body.style.display = entry.expanded ? '' : 'none';
      });

      row.appendChild(hdr);
      row.appendChild(body);
      return row;
    }

    function makeDotRow(label, runs) {
      const wrap = document.createElement('span');
      wrap.className = 'wf-dots';

      const lbl = document.createElement('span');
      lbl.className = 'wf-section-label';
      lbl.textContent = label;
      wrap.appendChild(lbl);

      Object.entries(runs).forEach(([wfName, run]) => {
        const dotSt = run ? runSt(run) : 'other';
        const item  = document.createElement('span');
        item.className = 'wf-dot-item';
        item.title     = `${wfName}: ${dotSt}`;

        const dot  = document.createElement('span');
        dot.className = `dot ${dotSt}`;

        const lbl2 = document.createElement('span');
        lbl2.className  = 'wf-dot-label';
        lbl2.textContent = wfName;

        item.appendChild(dot);
        item.appendChild(lbl2);
        wrap.appendChild(item);
      });
      return wrap;
    }

    function buildRunSection(title, wfNames, runsMap) {
      const section = document.createElement('div');
      section.className = 'pr-builds-section';

      const label = document.createElement('div');
      label.className   = 'pr-builds-label';
      label.textContent = title;
      section.appendChild(label);

      wfNames.forEach(wfName => {
        section.appendChild(buildRunLine(runsMap[wfName], wfName));
      });
      return section;
    }

    function buildRunLine(run, wfName) {
      if (!run) {
        const div = document.createElement('div');
        div.className = 'run-line other';
        const dot = document.createElement('span');
        dot.className = 'dot other';
        const info = document.createElement('span');
        info.className = 'run-line-info';
        info.innerHTML = `<span class="run-line-wf">${escHtml(wfName)}</span><span class="run-line-meta">No runs yet</span>`;
        div.appendChild(dot);
        div.appendChild(info);
        return div;
      }

      const st   = runSt(run);
      const a    = document.createElement('a');
      a.className = `run-line ${st}`;
      a.href      = run.html_url;
      a.target    = '_blank';
      a.rel       = 'noopener';

      const dot = document.createElement('span');
      dot.className = `dot ${st}`;

      const dur   = formatDuration(run);
      const title = run.display_title || run.head_commit?.message?.split('\n')[0] || wfName;
      const meta  = `${wfName} #${run.run_number}${dur ? ` · ${dur}` : ''} · ${timeAgo(run.created_at)}`;

      const info = document.createElement('span');
      info.className = 'run-line-info';
      info.innerHTML = `<span class="run-line-wf">${escHtml(title)}</span><span class="run-line-meta">${escHtml(meta)}</span>`;

      a.appendChild(dot);
      a.appendChild(info);
      return a;
    }

    // Like buildRunLine but for the "no PR" section: show branch + commit title instead of workflow name
    function buildDirectRunLine(run, wfName) {
      const st  = runSt(run);
      const a   = document.createElement('a');
      a.className = `run-line ${st}`;
      a.href      = run.html_url;
      a.target    = '_blank';
      a.rel       = 'noopener';

      const dot = document.createElement('span');
      dot.className = `dot ${st}`;

      const dur     = formatDuration(run);
      const branch  = run.head_branch || '';
      const title   = run.display_title || run.head_commit?.message?.split('\n')[0] || '';
      const numTime = `${wfName} #${run.run_number}${dur ? ` · ${dur}` : ''} · ${timeAgo(run.created_at)}`;
      const meta    = title ? `${title} · ${numTime}` : numTime;

      const info = document.createElement('span');
      info.className = 'run-line-info';
      info.innerHTML = `<span class="run-line-wf">${escHtml(branch)}</span><span class="run-line-meta">${escHtml(meta)}</span>`;

      a.appendChild(dot);
      a.appendChild(info);
      return a;
    }

    // ── Merge / automerge ────────────────────────────────────────────────────
    async function mergePREntry(pr, btn, repo, entry) {
      btn.disabled    = true;
      btn.textContent = '…';
      try {
        const res = await fetch(
          `https://api.github.com/repos/${getOrg()}/${repo}/pulls/${pr.number}/merge`,
          {
            method: 'PUT',
            headers: { Authorization: `Bearer ${getToken()}`, 'Content-Type': 'application/json', Accept: 'application/vnd.github+json' },
            body: JSON.stringify({ merge_method: 'squash' }),
          }
        );
        if (!res.ok && res.status !== 405) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.message || res.status);
        }
        const data = res.ok ? await res.json().catch(() => ({})) : {};
        // Optimistically mark merged so the row transitions immediately
        pr.merged_at        = new Date().toISOString();
        pr.merge_commit_sha = data.sha || null;
        delete prCache[repo];
        renderPRCards(repo);
        // Re-fetch to get actual merge_commit_sha + master build
        setTimeout(() => {
          delete prCache[repo];
          const repoEntry = REPOS.find(r => r.name === repo);
          if (repoEntry) fetchPRsForRepo(repoEntry);
        }, 3000);
      } catch(e) {
        btn.disabled    = false;
        btn.textContent = 'Merge';
        btn.title       = `Error: ${e.message}`;
      }
    }

    async function toggleAutoMerge(pr, btn, repo) {
      const enabling = pr.auto_merge === null;
      btn.disabled   = true;

      const query = enabling
        ? `mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:MERGE}){pullRequest{number}}}`
        : `mutation($id:ID!){disablePullRequestAutoMerge(input:{pullRequestId:$id}){pullRequest{number}}}`;

      try {
        const res  = await fetch('https://api.github.com/graphql', {
          method: 'POST',
          headers: { Authorization: `Bearer ${getToken()}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, variables: { id: pr.node_id } }),
        });
        const json = await res.json();
        if (json.errors?.length) throw new Error(json.errors[0].message);

        pr.auto_merge   = enabling ? {} : null;
        delete prCache[repo];
        btn.className   = enabling ? 'automerge-btn am-on' : 'automerge-btn am-off';
        btn.textContent = enabling ? 'AUTO ●' : 'AUTO ○';
      } catch(e) {
        btn.title = `Error: ${e.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    // ── Utility functions ────────────────────────────────────────────────────
    function runSt(run) {
      const s = run.status, c = run.conclusion;
      if (s === 'in_progress' || s === 'queued' || s === 'waiting') return 'running';
      if (c === 'success') return 'success';
      if (c === 'failure') return 'failure';
      return 'other';
    }

    function timeAgo(d) {
      const s = (Date.now() - new Date(d)) / 1000;
      if (s < 60)    return `${Math.round(s)}s ago`;
      if (s < 3600)  return `${Math.round(s/60)}m ago`;
      if (s < 86400) return `${Math.round(s/3600)}h ago`;
      return `${Math.round(s/86400)}d ago`;
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatDuration(run) {
      if (!run.run_started_at || !run.updated_at || run.status !== 'completed') return null;
      const secs = Math.round((new Date(run.updated_at) - new Date(run.run_started_at)) / 1000);
      const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
      if (h > 0) return `${h}h ${m}m ${s}s`;
      if (m > 0) return `${m}m ${s}s`;
      return `${s}s`;
    }

    function calcMood(rate) {
      return MOODS.find(m => rate >= m.min) || MOODS[MOODS.length - 1];
    }

    function isToday(d) {
      const x = new Date(d), n = new Date();
      return x.getFullYear() === n.getFullYear() && x.getMonth() === n.getMonth() && x.getDate() === n.getDate();
    }

    function updateMoodAndStats() {
      const allEntries    = Object.values(allPRData).flat();
      const openEntries   = allEntries.filter(e => !e.pr.merged_at);
      const mergedToday   = allEntries.filter(e => e.pr.merged_at && isToday(e.pr.merged_at));
      if (!allEntries.length) return;

      // Merged-today PRs count as wins in the mood calculation
      const total = openEntries.length + mergedToday.length;
      const ready = openEntries.filter(e => prStatus(e) === 'success').length + mergedToday.length;
      const rate  = total === 0 ? 0.5 : ready / total;
      const mood  = calcMood(rate);

      const emojiEl = document.getElementById('mood-emoji');
      if (mood.emoji !== lastMoodEmoji) {
        emojiEl.classList.remove('pop');
        void emojiEl.offsetWidth;
        emojiEl.classList.add('pop');
        lastMoodEmoji = mood.emoji;
      }
      emojiEl.textContent = mood.emoji;
      document.getElementById('mood-label').textContent = mood.label;

      const pill = document.getElementById('stats-pill');
      const parts = [];
      if (ready - mergedToday.length > 0) parts.push(`${ready - mergedToday.length} ready`);
      if (mergedToday.length > 0) parts.push(`${mergedToday.length} merged today`);
      pill.textContent = parts.length ? parts.join(' · ') : (openEntries.length ? '0 ready' : 'No open PRs');

      if (msgState.mood !== mood) {
        msgState.mood = mood;
        msgState.idx  = 0;
        if (msgTimer) clearInterval(msgTimer);
        showMsg(mood, 0);
        msgTimer = setInterval(() => {
          msgState.idx = (msgState.idx + 1) % mood.msgs.length;
          showMsg(mood, msgState.idx);
        }, MSG_ROTATE_MS);
      }
    }

    function showMsg(mood, idx) {
      const el = document.getElementById('motivational-msg');
      el.classList.remove('entering');
      el.textContent = mood.msgs[idx];
      el.classList.add('entering');
    }

    // ── Fetch all ────────────────────────────────────────────────────────────
    async function fetchAll() {
      if (!REPOS.length) return;
      const btn  = document.getElementById('refresh-btn');
      const tsEl = document.getElementById('last-refreshed');

      btn.classList.add('loading');
      btn.classList.remove('done');
      tsEl.classList.remove('done');

      // Clear PR cache for fresh data each cycle
      Object.keys(prCache).forEach(k => delete prCache[k]);

      await Promise.all(REPOS.map(r => fetchPRsForRepo(r)));
      updateMoodAndStats();
      tsEl.textContent = `Updated ${new Date().toLocaleTimeString()}`;

      btn.classList.remove('loading');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        btn.classList.add('done');
        tsEl.classList.add('done');
        btn.addEventListener('animationend',  () => btn.classList.remove('done'),  { once: true });
        tsEl.addEventListener('animationend', () => tsEl.classList.remove('done'), { once: true });
      }));
    }

    // ── Cards ────────────────────────────────────────────────────────────────
    function rebuildCards() {
      const container = document.getElementById('cards');
      const seen = new Set();
      const html = [];
      REPOS.forEach(r => {
        if (seen.has(r.name)) return;
        seen.add(r.name);
        const wfLabel = (r.workflows || []).join(' · ');
        html.push(`
          <div class="card" id="card-${escHtml(r.name)}">
            <div class="card-title">${escHtml(r.name)}</div>
            <div class="card-subtitle">${escHtml(wfLabel)}</div>
            <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
          </div>`);
      });
      container.innerHTML = html.join('');
    }

    // ── Settings: repo browser ───────────────────────────────────────────────
    async function loadReposForSettings() {
      const token = document.getElementById('s-token').value.trim();
      const org   = document.getElementById('s-org').value.trim();
      if (!token || !org) return;

      const btn = document.getElementById('load-repos-btn');
      const err = document.getElementById('repo-load-err');
      btn.disabled = true;
      btn.innerHTML = '<span class="spin">↻</span>';
      err.textContent = '';

      if (org !== lastLoadedOrg) {
        allRepos = [];
        Object.keys(repoWorkflows).forEach(k => delete repoWorkflows[k]);
        lastLoadedOrg = org;
      }

      const headers = { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' };

      try {
        let list;
        const orgRes = await fetch(
          `https://api.github.com/orgs/${encodeURIComponent(org)}/repos?per_page=100&sort=updated`,
          { headers }
        );
        if (orgRes.ok) {
          list = await orgRes.json();
        } else {
          const userRes = await fetch(
            `https://api.github.com/users/${encodeURIComponent(org)}/repos?per_page=100&sort=updated`,
            { headers }
          );
          if (!userRes.ok) throw new Error(userRes.status);
          list = await userRes.json();
        }

        allRepos = list.map(r => r.name).sort((a, b) => a.localeCompare(b));
        document.getElementById('repo-browser-section').style.display = '';
        document.getElementById('repo-search').value = '';
        renderRepoBrowser('');
      } catch(e) {
        err.textContent = `Could not load repos (${e.message})`;
      } finally {
        btn.disabled = false;
        btn.textContent = '↻';
      }
    }

    function renderRepoBrowser(search) {
      const q        = (search || '').toLowerCase();
      const filtered = q ? allRepos.filter(n => n.toLowerCase().includes(q)) : allRepos;
      const list     = document.getElementById('repo-browser-list');
      list.innerHTML = '';

      if (!filtered.length) {
        list.innerHTML = '<div class="ritem-empty" style="padding:10px 12px">No repos match</div>';
        return;
      }

      filtered.forEach(name => {
        const item = document.createElement('div');
        item.className  = 'repo-item';
        item.dataset.name = name;

        const hdr    = document.createElement('div');
        hdr.className = 'repo-item-hdr';
        hdr.innerHTML = `<span class="ritem-arrow">▶</span><span class="ritem-name">${escHtml(name)}</span>`;

        const wfList = document.createElement('div');
        wfList.className    = 'repo-wf-list';
        wfList.style.display = 'none';

        hdr.addEventListener('click', () => toggleRepoExpand(item));
        item.appendChild(hdr);
        item.appendChild(wfList);
        list.appendChild(item);
      });
    }

    async function toggleRepoExpand(item) {
      const name   = item.dataset.name;
      const wfList = item.querySelector('.repo-wf-list');
      const arrow  = item.querySelector('.ritem-arrow');

      if (wfList.style.display !== 'none') {
        wfList.style.display = 'none';
        arrow.textContent    = '▶';
        return;
      }

      wfList.style.display = '';
      arrow.textContent    = '▼';

      if (repoWorkflows[name] !== undefined) {
        renderWorkflows(item, repoWorkflows[name]);
        return;
      }

      wfList.innerHTML = '<div class="ritem-loading">loading…</div>';

      const token = document.getElementById('s-token').value.trim();
      const org   = document.getElementById('s-org').value.trim();

      try {
        const res = await fetch(
          `https://api.github.com/repos/${encodeURIComponent(org)}/${encodeURIComponent(name)}/actions/workflows?per_page=100`,
          { headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' } }
        );
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        repoWorkflows[name] = data.workflows;
        renderWorkflows(item, data.workflows);
      } catch(e) {
        wfList.innerHTML = `<div class="ritem-err">Error (${e.message})</div>`;
      }
    }

    function getMonitoringKeys() {
      const keys = new Set();
      document.querySelectorAll('#repos-list .monitoring-pill').forEach(pill => {
        const repo      = pill.dataset.repo;
        const workflows = JSON.parse(pill.dataset.workflows || '[]');
        workflows.forEach(wf => keys.add(`${repo}::${wf}`));
      });
      return keys;
    }

    function renderWorkflows(item, workflows) {
      const repoName = item.dataset.name;
      const wfList   = item.querySelector('.repo-wf-list');

      if (!workflows || !workflows.length) {
        wfList.innerHTML = '<div class="ritem-empty">No workflows found</div>';
        return;
      }

      const monitoring = getMonitoringKeys();
      wfList.innerHTML = '';

      workflows.forEach(wf => {
        const isAdded = monitoring.has(`${repoName}::${wf.name}`);
        const row     = document.createElement('div');
        row.className = 'wf-item';

        const nameEl = document.createElement('span');
        nameEl.className  = 'wf-name';
        nameEl.textContent = wf.name;

        const btn     = document.createElement('button');
        btn.className = isAdded ? 'wf-add-btn added' : 'wf-add-btn';
        btn.textContent = isAdded ? '✓' : '+';
        btn.disabled    = isAdded;
        btn.dataset.wf  = wf.name;

        if (!isAdded) {
          btn.addEventListener('click', () => addToMonitoring(repoName, wf.name, btn));
        }

        row.appendChild(nameEl);
        row.appendChild(btn);
        wfList.appendChild(row);
      });
    }

    function addToMonitoring(repoName, workflowName, btn) {
      if (btn) {
        btn.className   = 'wf-add-btn added';
        btn.textContent = '✓';
        btn.disabled    = true;
      }

      const list = document.getElementById('repos-list');
      let pill   = list.querySelector(`.monitoring-pill[data-repo="${CSS.escape(repoName)}"]`);

      if (pill) {
        const workflows = JSON.parse(pill.dataset.workflows || '[]');
        if (!workflows.includes(workflowName)) {
          workflows.push(workflowName);
          pill.dataset.workflows = JSON.stringify(workflows);
          renderPillChips(pill, repoName, workflows);
        }
      } else {
        pill = document.createElement('div');
        pill.className         = 'monitoring-pill';
        pill.dataset.repo      = repoName;
        pill.dataset.workflows = JSON.stringify([workflowName]);

        const repoLabel = document.createElement('span');
        repoLabel.className  = 'pill-repo-name';
        repoLabel.textContent = repoName;

        const chipsEl = document.createElement('span');
        chipsEl.className = 'pill-wf-chips';

        const rmAllBtn = document.createElement('button');
        rmAllBtn.className   = 'pill-remove';
        rmAllBtn.textContent = '✕';
        rmAllBtn.title       = 'Remove repo';
        rmAllBtn.addEventListener('click', () => removeRepoFromMonitoring(pill, repoName));

        pill.appendChild(repoLabel);
        pill.appendChild(chipsEl);
        pill.appendChild(rmAllBtn);
        list.appendChild(pill);
        renderPillChips(pill, repoName, [workflowName]);
      }

      updateMonitoringState();
    }

    function renderPillChips(pill, repoName, workflows) {
      const chipsEl = pill.querySelector('.pill-wf-chips');
      chipsEl.innerHTML = '';
      workflows.forEach(wf => {
        const chip = document.createElement('span');
        chip.className = 'pill-wf-chip';
        chip.appendChild(document.createTextNode(wf));

        const rmBtn = document.createElement('button');
        rmBtn.className   = 'pill-wf-chip-remove';
        rmBtn.textContent = '×';
        rmBtn.title       = `Remove ${wf}`;
        rmBtn.addEventListener('click', () => removeWorkflowFromPill(pill, repoName, wf));
        chip.appendChild(rmBtn);
        chipsEl.appendChild(chip);
      });
    }

    function removeWorkflowFromPill(pill, repoName, workflowName) {
      let workflows = JSON.parse(pill.dataset.workflows || '[]');
      workflows = workflows.filter(w => w !== workflowName);

      if (!workflows.length) {
        removeRepoFromMonitoring(pill, repoName);
        return;
      }

      pill.dataset.workflows = JSON.stringify(workflows);
      renderPillChips(pill, repoName, workflows);
      updateMonitoringState();
      refreshRepoBrowserItem(repoName);
    }

    function removeRepoFromMonitoring(pill, repoName) {
      pill.remove();
      updateMonitoringState();
      refreshRepoBrowserItem(repoName);
    }

    function refreshRepoBrowserItem(repoName) {
      const repoItem = document.querySelector(`#repo-browser-list .repo-item[data-name="${CSS.escape(repoName)}"]`);
      if (repoItem && repoWorkflows[repoName] !== undefined) {
        const wfList = repoItem.querySelector('.repo-wf-list');
        if (wfList && wfList.style.display !== 'none') renderWorkflows(repoItem, repoWorkflows[repoName]);
      }
    }

    function updateMonitoringState() {
      const count = document.querySelectorAll('#repos-list .monitoring-pill').length;
      document.getElementById('monitoring-label').textContent =
        count ? `Monitoring (${count})` : 'Monitoring';
      document.getElementById('monitoring-empty').style.display = count ? 'none' : '';
    }

    // ── Settings panel ───────────────────────────────────────────────────────
    function openSettings() {
      document.getElementById('s-token').value = getToken();
      document.getElementById('s-org').value   = getOrg();
      document.getElementById('repo-load-err').textContent = '';

      const list = document.getElementById('repos-list');
      list.innerHTML = '';
      getRepos().forEach(r => {
        (r.workflows || []).forEach(wf => addToMonitoring(r.name, wf, null));
      });
      updateMonitoringState();

      if (allRepos.length) {
        document.getElementById('repo-browser-section').style.display = '';
        renderRepoBrowser(document.getElementById('repo-search').value);
      } else {
        document.getElementById('repo-browser-section').style.display = 'none';
      }

      document.getElementById('settings-overlay').classList.add('open');
    }

    function closeSettings() {
      document.getElementById('settings-overlay').classList.remove('open');
    }

    function overlayClick(e) {
      if (e.target === document.getElementById('settings-overlay')) closeSettings();
    }

    function toggleTokenVis() {
      const inp = document.getElementById('s-token');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    function saveSettings() {
      const token = document.getElementById('s-token').value.trim();
      const org   = document.getElementById('s-org').value.trim();
      if (token) localStorage.setItem('gh_token', token);
      if (org)   localStorage.setItem('gh_org', org);

      const newRepos = [];
      document.querySelectorAll('#repos-list .monitoring-pill').forEach(pill => {
        const workflows = JSON.parse(pill.dataset.workflows || '[]');
        if (workflows.length) newRepos.push({ name: pill.dataset.repo, workflows });
      });
      if (newRepos.length) {
        REPOS = newRepos;
        localStorage.setItem('gh_repos', JSON.stringify(REPOS));
      }

      Object.keys(wfIdCache).forEach(k => delete wfIdCache[k]);
      Object.keys(prCache).forEach(k => delete prCache[k]);
      allPRData     = {};
      allDirectRuns = {};
      closeSettings();
      rebuildCards();
      fetchAll();
    }

    // ── Interval picker ──────────────────────────────────────────────────────
    function togglePicker() {
      document.getElementById('interval-options').classList.toggle('open');
    }

    function setRefresh(secs) {
      refreshInterval = secs * 1000;
      clearInterval(refreshTimer);
      refreshTimer = setInterval(fetchAll, refreshInterval);
      const label = secs < 60 ? `${secs}s` : secs === 60 ? '1m' : secs === 90 ? '90s' : '2m';
      document.getElementById('interval-trigger').textContent = label;
      document.querySelectorAll('.iopt').forEach(el =>
        el.classList.toggle('active', +el.dataset.s === secs)
      );
      document.getElementById('interval-options').classList.remove('open');
    }

    document.addEventListener('click', e => {
      if (!document.getElementById('interval-ctrl').contains(e.target))
        document.getElementById('interval-options').classList.remove('open');
    });

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSettings(); });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearInterval(refreshTimer);
        refreshTimer = null;
      } else if (REPOS.length) {
        fetchAll();
        refreshTimer = setInterval(fetchAll, refreshInterval);
      }
    });

    document.getElementById('load-repos-btn').addEventListener('click', loadReposForSettings);
    document.getElementById('repo-search').addEventListener('input', e => renderRepoBrowser(e.target.value));

    // ── Init ─────────────────────────────────────────────────────────────────
    async function init() {
      REPOS = getRepos();
      if (!getToken() || !getOrg() || !REPOS.length) {
        openSettings();
        return;
      }
      rebuildCards();
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
      fetchAll();
      refreshTimer = setInterval(fetchAll, refreshInterval);
    }

    init();
  </script>
</body>
