<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub CI Status</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes btnFlash {
      0%   { background: rgba(0,212,170,0.35); border-color: rgba(0,212,170,0.7); }
      100% { background: rgba(0,212,170,0.1);  border-color: rgba(0,212,170,0.25); }
    }
    @keyframes tsFlash {
      0%   { color: #00d4aa; letter-spacing: 0.04em; }
      60%  { color: #00d4aa; letter-spacing: 0; }
      100% { color: #3a3a4a; letter-spacing: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1;   }
      50%       { opacity: 0.4; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes emojiPop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.25); }
      70%  { transform: scale(0.95); }
      100% { transform: scale(1); }
    }
    @keyframes msgFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background: #151c2e;
      min-height: 100vh;
      color: #e0e0e0;
      padding: 22px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(135deg, #151c2e 0%, #1b2a40 30%, #0f3636 55%, #153030 75%, #1a2030 100%);
    }

    /* ── Mood header ── */
    #mood-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      animation: fadeInUp 0.5s ease both;
      flex-wrap: wrap;
    }
    #mood-emoji {
      font-size: 3.8rem;
      line-height: 1;
      filter: drop-shadow(0 0 14px rgba(0, 212, 170, 0.5));
    }
    #mood-emoji.pop { animation: emojiPop 0.45s cubic-bezier(.36,.07,.19,.97) both; }
    #mood-label {
      font-size: 0.9rem;
      font-weight: 800;
      color: #00d4aa;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    #stats-pill {
      font-size: 0.85rem;
      color: #7ecfb8;
      font-weight: 600;
    }

    /* ── Mantra ── */
    #stats-bar {
      text-align: center;
      animation: fadeInUp 0.5s ease 0.1s both;
      margin-bottom: 10px;
    }
    #motivational-msg {
      font-size: 1rem;
      color: #667;
      font-style: italic;
      min-height: 1.2em;
    }
    #motivational-msg.entering { animation: msgFadeIn 0.45s ease both; }

    /* ── Cards grid ── */
    #cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      align-content: start;
      animation: fadeInUp 0.5s ease 0.2s both;
    }
    .card {
      background: rgba(22, 30, 48, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 14px;
      min-width: 0;
    }
    .card-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: #8ab8ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 1px;
    }
    .card-subtitle {
      font-size: 0.64rem;
      color: #445;
      margin-bottom: 10px;
    }

    /* ── Branch rows ── */
    .branch-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 7px 4px 4px;
      border-radius: 6px;
      transition: background 0.12s;
    }
    .branch-row:hover { background: rgba(255,255,255,0.03); }

    .branch-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .branch-dot.success { background: #00d4aa; box-shadow: 0 0 5px rgba(0,212,170,0.5); }
    .branch-dot.failure { background: #ff4757; box-shadow: 0 0 7px rgba(255,71,87,0.6); }
    .branch-dot.running { background: #ffd43b; animation: pulse 1.4s ease-in-out infinite; }
    .branch-dot.other   { background: #3a3a4a; }
    .branch-dot.merged  { background: #a371f7; box-shadow: 0 0 5px rgba(163,113,247,0.45); }

    .merged-badge {
      font-size: 0.57rem;
      font-weight: 600;
      color: #7a5ea0;
      letter-spacing: 0.03em;
      flex-shrink: 0;
    }

    .branch-name {
      font-size: 0.65rem;
      font-weight: 600;
      color: #889;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
      flex-shrink: 0;
      text-decoration: none;
    }
    .branch-name:hover { color: #aab; }

    .branch-commit {
      font-size: 0.63rem;
      color: #4a5060;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .branch-time {
      font-size: 0.59rem;
      color: #384050;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Section separator ── */
    .section-sep {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 8px 2px 5px;
      color: #2a2f3a;
      font-size: 0.55rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }
    .section-sep::before, .section-sep::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.04);
    }

    /* ── Skeleton ── */
    .skeleton {
      height: 42px;
      border-radius: 8px;
      background: linear-gradient(90deg,
        rgba(255,255,255,0.03) 25%,
        rgba(255,255,255,0.07) 50%,
        rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      margin-bottom: 2px;
    }
    .err { color: #ff6b6b; font-size: 0.72rem; padding: 4px 2px; }
    .no-runs-msg { font-size: 0.68rem; color: #445; padding: 4px 7px 2px; font-style: italic; }

    /* ── Automerge toggle ── */
    .automerge-btn {
      flex-shrink: 0;
      border-radius: 5px;
      font-size: 0.58rem;
      font-weight: 700;
      font-family: inherit;
      padding: 2px 6px;
      cursor: pointer;
      line-height: 1.5;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }
    .automerge-btn.am-off {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: #445;
    }
    .automerge-btn.am-off:hover  { border-color: rgba(0,212,170,0.35); color: #00d4aa; }
    .automerge-btn.am-on {
      background: rgba(0,212,170,0.12);
      border: 1px solid rgba(0,212,170,0.35);
      color: #00d4aa;
    }
    .automerge-btn.am-on:hover   { background: rgba(0,212,170,0.22); }
    .automerge-btn.am-creating {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: #667;
    }
    .automerge-btn.am-creating::after {
      content: '';
      display: inline-block;
      width: 7px; height: 7px;
      border: 1.5px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-left: 5px;
      vertical-align: middle;
    }
    .automerge-btn:disabled      { opacity: 0.5; pointer-events: none; }

    /* ── Merge button — GitHub purple ── */
    .merge-btn {
      flex-shrink: 0;
      border-radius: 5px;
      font-size: 0.58rem;
      font-weight: 700;
      font-family: inherit;
      padding: 2px 6px;
      cursor: pointer;
      line-height: 1.5;
      white-space: nowrap;
      background: rgba(130,80,223,0.15);
      border: 1px solid rgba(130,80,223,0.45);
      color: #a371f7;
      transition: background 0.15s, opacity 0.15s;
    }
    .merge-btn:hover    { background: rgba(130,80,223,0.28); }
    .merge-btn:disabled { opacity: 0.4; pointer-events: none; }
    .merge-btn.merged   { background: transparent; border-color: rgba(130,80,223,0.15); color: #7a5ea0; cursor: default; }
    .merge-btn.error    { background: rgba(220,50,50,0.15); border-color: rgba(220,50,50,0.5); color: #e06060; }
    .merge-btn.queued   { background: rgba(0,150,220,0.15); border-color: rgba(0,150,220,0.5); color: #4db8ff; cursor: default; }

    /* ── Footer ── */
    #footer {
      text-align: right;
      font-size: 0.64rem;
      color: #3a3a4a;
      animation: fadeInUp 0.5s ease 0.3s both;
    }

    /* ── Top-right controls ── */
    #top-controls {
      position: fixed;
      top: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 10;
    }
    #refresh-btn {
      background: rgba(0,212,170,0.1);
      border: 1px solid rgba(0,212,170,0.25);
      color: #00d4aa;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s;
      padding: 0;
    }
    #refresh-btn:hover  { background: rgba(0,212,170,0.18); }
    #refresh-btn:active { transform: scale(0.92); }
    #refresh-btn.loading { pointer-events: none; opacity: 0.5; }
    #refresh-btn.loading .ri { display: inline-block; animation: spin 0.7s linear infinite; }
    #refresh-btn.done { animation: btnFlash 0.9s ease forwards; }
    #last-refreshed.done { animation: tsFlash 1.6s ease forwards; }
    .ri { line-height: 1; }

    /* ── Interval control ── */
    #interval-ctrl {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 34px;
    }
    #interval-trigger {
      font-size: 0.65rem;
      font-weight: 700;
      color: #557;
      cursor: pointer;
      user-select: none;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      transition: color 0.12s, background 0.12s;
      white-space: nowrap;
    }
    #interval-trigger:hover { color: #00d4aa; background: rgba(0,212,170,0.08); }
    #interval-options {
      display: flex;
      align-items: center;
      gap: 3px;
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
      transition: max-width 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.2s ease;
    }
    #interval-options.open { max-width: 320px; opacity: 1; pointer-events: all; }
    .iopt {
      font-size: 0.61rem;
      font-weight: 600;
      color: #3a3a5a;
      cursor: pointer;
      padding: 3px 7px;
      border-radius: 7px;
      white-space: nowrap;
      user-select: none;
      transition: color 0.12s, background 0.12s;
    }
    .iopt:hover  { color: #00d4aa; }
    .iopt.active { color: #00d4aa; background: rgba(0,212,170,0.12); }
    #settings-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.13);
      color: #99a;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: color 0.15s, background 0.15s, transform 0.4s cubic-bezier(0.4,0,0.2,1);
      padding: 0;
    }
    #settings-btn:hover { color: #00d4aa; background: rgba(0,212,170,0.1); transform: rotate(75deg); }
    #github-link {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.13);
      color: #99a;
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: color 0.15s, background 0.15s;
    }
    #github-link:hover { color: #00d4aa; background: rgba(0,212,170,0.1); }
    #github-link svg { width: 18px; height: 18px; fill: currentColor; }

    /* ── Settings overlay ── */
    #settings-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #settings-overlay.open { opacity: 1; pointer-events: all; }

    #settings-panel {
      background: rgba(16,16,32,0.97);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 18px;
      padding: 26px 24px 22px;
      width: 440px;
      max-width: calc(100vw - 32px);
      max-height: calc(100vh - 64px);
      overflow-y: auto;
      transform: translateY(-14px) scale(0.97);
      transition: transform 0.22s cubic-bezier(0.4,0,0.2,1);
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }
    #settings-overlay.open #settings-panel { transform: translateY(0) scale(1); }

    #settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    #settings-header span {
      font-size: 0.85rem;
      font-weight: 800;
      color: #00d4aa;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    #settings-close {
      background: none;
      border: none;
      color: #445;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 2px 5px;
      border-radius: 6px;
      transition: color 0.12s;
    }
    #settings-close:hover { color: #e0e0e0; }

    .s-label {
      font-size: 0.65rem;
      font-weight: 700;
      color: #556;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }
    .s-section { margin-bottom: 20px; }

    .token-wrap { position: relative; }
    .token-wrap .s-input { padding-right: 38px; }
    #token-toggle {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #445;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0;
      line-height: 1;
      transition: color 0.12s;
    }
    #token-toggle:hover { color: #00d4aa; }

    .org-row { display: flex; gap: 6px; }
    .org-row .s-input { flex: 1; }
    .load-repos-btn {
      background: rgba(0,212,170,0.1);
      border: 1px solid rgba(0,212,170,0.25);
      border-radius: 8px;
      color: #00d4aa;
      font-size: 1rem;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.12s;
      flex-shrink: 0;
      padding: 0;
    }
    .load-repos-btn:hover   { background: rgba(0,212,170,0.2); }
    .load-repos-btn:disabled { opacity: 0.4; pointer-events: none; }
    .load-repos-btn .spin   { display: inline-block; animation: spin 0.7s linear infinite; }
    #repo-load-err {
      font-size: 0.65rem;
      color: #ff6b6b;
      margin-top: 5px;
      min-height: 0;
    }

    /* ── Repo browser ── */
    #repo-search { margin-bottom: 6px; }
    #repo-browser-list {
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px;
      background: rgba(0,0,0,0.18);
      max-height: 200px;
      overflow-y: auto;
    }
    #repo-browser-list::-webkit-scrollbar { width: 4px; }
    #repo-browser-list::-webkit-scrollbar-track { background: transparent; }
    #repo-browser-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .repo-item { border-bottom: 1px solid rgba(255,255,255,0.04); }
    .repo-item:last-child { border-bottom: none; }
    .repo-item-hdr {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }
    .repo-item-hdr:hover { background: rgba(255,255,255,0.04); }
    .ritem-arrow {
      font-size: 0.55rem;
      color: #3a3a5a;
      width: 10px;
      flex-shrink: 0;
      transition: color 0.12s;
      line-height: 1;
    }
    .repo-item-hdr:hover .ritem-arrow { color: #00d4aa; }
    .ritem-name {
      font-size: 0.72rem;
      color: #aaa;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .repo-wf-list { padding: 0 8px 6px 26px; }
    .wf-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 2px;
    }
    .wf-name {
      font-size: 0.68rem;
      color: #667;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .wf-add-btn {
      background: rgba(0,212,170,0.08);
      border: 1px solid rgba(0,212,170,0.22);
      border-radius: 5px;
      color: #00d4aa;
      font-size: 0.65rem;
      font-weight: 700;
      font-family: inherit;
      padding: 2px 7px;
      cursor: pointer;
      flex-shrink: 0;
      line-height: 1.4;
      transition: background 0.1s;
    }
    .wf-add-btn:hover  { background: rgba(0,212,170,0.2); }
    .wf-add-btn.added  {
      background: transparent;
      border-color: rgba(255,255,255,0.07);
      color: #3a5a4a;
      cursor: default;
    }
    .ritem-loading { font-size: 0.65rem; color: #445; padding: 6px 2px; }
    .ritem-empty   { font-size: 0.65rem; color: #334; padding: 6px 2px; }
    .ritem-err     { font-size: 0.65rem; color: #ff6b6b; padding: 6px 2px; }

    /* ── Monitoring pills ── */
    #repos-list { display: flex; flex-direction: column; gap: 5px; }
    .monitoring-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 8px;
      flex-wrap: wrap;
    }
    .pill-repo-name {
      font-size: 0.72rem;
      color: #8ab8ff;
      font-weight: 600;
      flex-shrink: 0;
    }
    .pill-wf-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      flex: 1;
      min-width: 0;
    }
    .pill-wf-chip {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 0.62rem;
      color: #778;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      padding: 1px 4px 1px 6px;
    }
    .pill-wf-chip-remove {
      background: none;
      border: none;
      color: #334;
      cursor: pointer;
      font-size: 0.65rem;
      padding: 0;
      line-height: 1;
      transition: color 0.12s;
    }
    .pill-wf-chip-remove:hover { color: #ff4757; }
    .pill-remove {
      background: none;
      border: none;
      color: #334;
      cursor: pointer;
      font-size: 0.65rem;
      padding: 0 2px;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.12s;
    }
    .pill-remove:hover { color: #ff4757; }
    #monitoring-empty {
      font-size: 0.68rem;
      color: #334;
      padding: 6px 2px;
    }

    .s-input {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      color: #ccc;
      font-size: 0.72rem;
      font-family: inherit;
      padding: 7px 10px;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
    }
    .s-input:focus { border-color: rgba(0,212,170,0.45); }
    .s-input::placeholder { color: #334; }

    #settings-save {
      width: 100%;
      background: rgba(0,212,170,0.12);
      border: 1px solid rgba(0,212,170,0.3);
      border-radius: 10px;
      color: #00d4aa;
      font-size: 0.75rem;
      font-weight: 800;
      font-family: inherit;
      padding: 9px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.15s;
      margin-top: 4px;
    }
    #settings-save:hover  { background: rgba(0,212,170,0.22); }
    #settings-save:active { transform: scale(0.98); }

    #reset-btn {
      width: 100%;
      background: none;
      border: 1px solid rgba(248,81,73,0.4);
      border-radius: 10px;
      color: #f85149;
      font-size: 0.7rem;
      font-family: inherit;
      padding: 7px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.15s;
      margin-top: 6px;
    }
    #reset-btn:hover { background: rgba(248,81,73,0.1); }

  </style>
</head>
<body>

  <div id="top-controls">
    <div id="interval-ctrl">
      <div id="interval-options">
        <span class="iopt"        data-s="10"  onclick="setRefresh(10)">10s</span>
        <span class="iopt"        data-s="20"  onclick="setRefresh(20)">20s</span>
        <span class="iopt"        data-s="30"  onclick="setRefresh(30)">30s</span>
        <span class="iopt"        data-s="40"  onclick="setRefresh(40)">40s</span>
        <span class="iopt"        data-s="50"  onclick="setRefresh(50)">50s</span>
        <span class="iopt active"  data-s="60"  onclick="setRefresh(60)">1m</span>

    </div>
    <button id="refresh-btn" onclick="fetchAll()" title="Refresh now"><span class="ri">↻</span></button>
    <a id="github-link" href="https://github.com/inreachventures/github_status" target="_blank" rel="noopener" title="View on GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
    <button id="settings-btn" onclick="openSettings()" title="Settings">⚙</button>
  </div>

  <div id="settings-overlay" onclick="overlayClick(event)">
    <div id="settings-panel">
      <div id="settings-header">
        <span>Settings</span>
        <button id="settings-close" onclick="closeSettings()">✕</button>
      </div>

      <div class="s-section">
        <label class="s-label">GitHub Token</label>
        <div class="token-wrap">
          <input id="s-token" type="password" class="s-input" placeholder="ghp_…" spellcheck="false">
          <button id="token-toggle" onclick="toggleTokenVis()" title="Show/hide">👁</button>
        </div>
        <div style="margin-top:6px;font-size:11px;color:#8b949e;line-height:1.5">
          <a href="https://github.com/settings/tokens/new?description=github_status%20dashboard&scopes=repo,workflow,read:org" target="_blank" rel="noopener" style="color:#58a6ff;text-decoration:none">Create a token on GitHub</a>
          with <code style="background:#161b22;padding:1px 4px;border-radius:3px">repo</code>, <code style="background:#161b22;padding:1px 4px;border-radius:3px">workflow</code>, and <code style="background:#161b22;padding:1px 4px;border-radius:3px">read:org</code> scopes.
          Your token is stored only in your browser's local storage — nothing is sent to any server.
        </div>
      </div>

      <div class="s-section">
        <label class="s-label">Organization / Username</label>
        <div class="org-row">
          <input id="s-org" class="s-input" placeholder="your-github-org" spellcheck="false">
          <button id="load-repos-btn" class="load-repos-btn" title="Load repositories">↻</button>
        </div>
        <div id="repo-load-err"></div>
      </div>

      <div class="s-section" id="repo-browser-section" style="display:none">
        <label class="s-label">Available Repositories</label>
        <input id="repo-search" class="s-input" placeholder="Search repos…" spellcheck="false">
        <div id="repo-browser-list"></div>
      </div>

      <div class="s-section">
        <label class="s-label" id="monitoring-label">Monitoring</label>
        <div id="repos-list"></div>
        <div id="monitoring-empty" style="display:none">No repos selected — expand a repo above and click +</div>
      </div>

      <button id="settings-save" onclick="saveSettings()">Save &amp; Refresh</button>
      <button id="reset-btn" onclick="resetAllData()">Reset all data</button>
    </div>
  </div>

  <div id="mood-header">
    <span id="stats-pill">Fetching builds…</span>
    <span id="mood-emoji">⏳</span>
    <span id="mood-label">Loading…</span>
  </div>

  <div id="stats-bar">
    <div id="motivational-msg"></div>
  </div>

  <div id="cards"></div>

  <div id="footer">
    <span id="last-refreshed">—</span>
  </div>

  <script src="github-api.js"></script>
  <script>
    let REPOS = [];
    let refreshInterval = 60_000;
    let refreshTimer    = null;
    const MSG_ROTATE_MS = 9_000;

    const MOODS = [
      {
        min: 0.90, emoji: '🚀', label: 'Shipping mode',
        msgs: [
          'Zero issues. You\'re basically DevOps gods.',
          'Green across the board — absolute legends!',
          'The pipeline loves you and honestly, same.',
          'Ship it. Ship it again. Ship it harder.',
        ]
      },
      {
        min: 0.70, emoji: '😎', label: 'Looking solid',
        msgs: [
          'Solid work — keep that momentum!',
          'The pipeline approves of your life choices.',
          'Almost perfect. Perfection is overrated anyway.',
          'Cruising altitude. Stay sharp.',
        ]
      },
      {
        min: 0.45, emoji: '😤', label: 'Fighting through',
        msgs: [
          'A few bumps but the mission continues.',
          'Failures are just data. Fix and ship!',
          'Some reds? Debug mode: activated.',
          'The pipeline wants to be fixed. It believes in you.',
        ]
      },
      {
        min: 0.20, emoji: '😰', label: 'Needs some love',
        msgs: [
          'The pipeline needs some TLC today.',
          'Every failure is a lesson. Time to learn fast.',
          'CI is having a moment. You\'ve got this.',
          'Breathe. Revert if you must. Regroup.',
        ]
      },
      {
        min: 0, emoji: '💀', label: 'Red alert',
        msgs: [
          'Okay, we\'ve seen worse… probably.',
          'Red builds build character. Or so they say.',
          'git bisect is your friend right now.',
          'The pipeline is crying. Show it some love.',
        ]
      },
    ];

    let msgState      = { mood: null, idx: 0 };
    let msgTimer      = null;
    let lastMoodEmoji = null;
    const wfIdCache   = {};

    // ── Repo browser state ───────────────────────────────────────────────────
    let allRepos = [];
    let lastLoadedOrg = '';
    const repoWorkflows = {};

    // ── Storage helpers ──────────────────────────────────────────────────────
    // getToken()/getOrg() now live in github-api.js
    function getRepos() {
      try {
        const s = localStorage.getItem('gh_repos');
        if (!s) return [];
        let repos = JSON.parse(s);
        // Migrate old { name, workflow } format to { name, workflows[] }
        if (repos.length && repos[0].workflow !== undefined) {
          const byName = {};
          repos.forEach(r => {
            if (!byName[r.name]) byName[r.name] = [];
            if (r.workflow && !byName[r.name].includes(r.workflow)) byName[r.name].push(r.workflow);
          });
          repos = Object.entries(byName).map(([name, workflows]) => ({ name, workflows }));
          localStorage.setItem('gh_repos', JSON.stringify(repos));
        }
        return repos;
      } catch(e) {}
      return [];
    }

    // ── GitHub API ───────────────────────────────────────────────────────────
    // ghFetch()/fetchPRForBranch() now live in github-api.js

    async function findWorkflowId(repo, workflowName) {
      const key = `${repo}:${workflowName}`;
      if (wfIdCache[key]) return wfIdCache[key];
      const data = await ghFetch(`/repos/${getOrg()}/${repo}/actions/workflows?per_page=100`);
      const wf = data.workflows.find(w => w.name === workflowName);
      if (wf) wfIdCache[key] = wf.id;
      return wf ? wf.id : null;
    }

    // ── Fetch runs for a repo ────────────────────────────────────────────────
    async function fetchRunsForRepo({ name: repo, workflows: workflowNames }) {
      const card = document.getElementById(`card-${repo}`);
      if (!card) return;

      try {
        // Resolve workflow IDs
        const wfIds = {};
        await Promise.all((workflowNames || []).map(async wfName => {
          wfIds[wfName] = await findWorkflowId(repo, wfName);
        }));

        // Fetch runs + branches + open PRs + (once) repo default branch in parallel
        const runsByWf = {};
        const org = getOrg();
        const [, branchesResp, prsResp, repoResp] = await Promise.all([
          Promise.all((workflowNames || []).map(async wfName => {
            const wfId = wfIds[wfName];
            if (!wfId) { runsByWf[wfName] = []; return; }
            try {
              const d = await ghFetch(
                `/repos/${org}/${repo}/actions/workflows/${wfId}/runs?per_page=20`
              );
              runsByWf[wfName] = d.workflow_runs || [];
            } catch(e) {
              runsByWf[wfName] = [];
            }
          })),
          ghFetch(`/repos/${org}/${repo}/branches?per_page=100&sort=updated&direction=desc`).catch(() => null),
          ghFetch(`/repos/${org}/${repo}/pulls?state=open&per_page=100`).catch(() => null),
          repoDefaultBranch[repo] ? Promise.resolve(null) : ghFetch(`/repos/${org}/${repo}`).catch(() => null),
        ]);

        const activeBranches = new Set((branchesResp || []).map(b => b.name));

        prCache[repo] = {};
        (prsResp || []).forEach(pr => { prCache[repo][pr.head.ref] = pr; });

        if (repoResp?.default_branch) repoDefaultBranch[repo] = repoResp.default_branch;

        allRunsByRepo[repo] = { runsByWf, activeBranches };
        renderBranchCards(repo);
      } catch(e) {
        const sub = card.querySelector('.card-subtitle');
        while (sub && sub.nextSibling) sub.nextSibling.remove();
        card.insertAdjacentHTML('beforeend', `<div class="err">Error: ${escHtml(e.message)}</div>`);
      }
    }

    // ── Render: group runs by branch ─────────────────────────────────────────
    function renderBranchCards(repo) {
      const card = document.getElementById(`card-${repo}`);
      if (!card) return;

      const sub = card.querySelector('.card-subtitle');
      while (sub && sub.nextSibling) sub.nextSibling.remove();

      const { runsByWf = {}, activeBranches } = allRunsByRepo[repo] || {};
      const allItems = Object.entries(runsByWf)
        .flatMap(([wfName, runs]) => runs.map(r => ({ run: r, wfName })));

      if (!allItems.length) {
        card.insertAdjacentHTML('beforeend', '<div class="no-runs-msg">No runs found</div>');
        return;
      }

      // Only keep runs from the last 7 days
      const weekAgo = Date.now() - 7 * 24 * 3600 * 1000;
      const weekItems = allItems.filter(i => new Date(i.run.created_at).getTime() > weekAgo);

      // Group by branch
      const byBranch = {};
      weekItems.forEach(item => {
        const b = item.run.head_branch || '(unknown)';
        if (!byBranch[b]) byBranch[b] = [];
        byBranch[b].push(item);
      });

      // Sort by most recent run desc, cap at 5 branches
      const branches = Object.entries(byBranch)
        .sort((a, b) => {
          const aT = Math.max(...a[1].map(i => new Date(i.run.created_at).getTime()));
          const bT = Math.max(...b[1].map(i => new Date(i.run.created_at).getTime()));
          return bT - aT;
        })
        .slice(0, 5);

      // Split: today vs older (within the week)
      const todayBranches = branches.filter(([, items]) =>
        items.some(i => isToday(i.run.created_at))
      );
      const olderBranches = branches.filter(([, items]) =>
        !items.some(i => isToday(i.run.created_at))
      );

      const appendSep = label => {
        const sep = document.createElement('div');
        sep.className = 'section-sep';
        sep.innerHTML = `<span>${label}</span>`;
        card.appendChild(sep);
      };

      const hasBoth = todayBranches.length && olderBranches.length;
      if (hasBoth) appendSep('today');
      todayBranches.forEach(([branch, items]) => card.appendChild(buildBranchGroup(repo, branch, items)));
      if (olderBranches.length) appendSep('older');
      olderBranches.forEach(([branch, items]) => card.appendChild(buildBranchGroup(repo, branch, items)));
    }

    function buildBranchGroup(repo, branch, items) {
      // Latest run per workflow → branch status + most recent run overall
      const latestByWf = {};
      items.forEach(({ run, wfName }) => {
        if (!latestByWf[wfName] || new Date(run.created_at) > new Date(latestByWf[wfName].created_at)) {
          latestByWf[wfName] = run;
        }
      });
      const statuses = Object.values(latestByWf).map(runSt);
      const branchSt = statuses.every(s => s === 'success') ? 'success'
                     : statuses.some(s => s === 'running')  ? 'running'
                     : statuses.some(s => s === 'failure')  ? 'failure'
                     : 'other';

      const newestRun = Object.values(latestByWf).sort(
        (a, b) => new Date(b.created_at) - new Date(a.created_at)
      )[0];

      const row = document.createElement('div');
      row.className = 'branch-row';

      const activeBranches = allRunsByRepo[repo]?.activeBranches;
      const branchExists   = !activeBranches || activeBranches.size === 0 || activeBranches.has(branch);
      const isDefaultBranch = /^(main|master|develop|development)$/.test(branch);
      const isMerged       = !isDefaultBranch && !branchExists;

      const dot = document.createElement('span');
      dot.className = `branch-dot ${isMerged ? 'merged' : branchSt}`;

      const pr = prCache[repo]?.[branch] ?? null;
      const runUrl = newestRun?.html_url || '#';
      const nameLink = document.createElement('a');
      nameLink.className  = 'branch-name';
      nameLink.textContent = branch;
      nameLink.title       = branch;
      nameLink.href        = pr?.html_url || runUrl;
      nameLink.target      = '_blank';
      nameLink.rel         = 'noopener';

      const commitEl = document.createElement('span');
      commitEl.className   = 'branch-commit';
      commitEl.textContent = newestRun?.display_title || newestRun?.head_commit?.message?.split('\n')[0] || '';

      const timeEl = document.createElement('span');
      timeEl.className   = 'branch-time';
      timeEl.textContent = newestRun ? timeAgo(newestRun.created_at) : '';

      row.appendChild(dot);
      row.appendChild(nameLink);
      row.appendChild(commitEl);
      row.appendChild(timeEl);

      if (isMerged) {
        const badge = document.createElement('span');
        badge.className   = 'merged-badge';
        badge.textContent = 'Merged';
        row.appendChild(badge);
      } else if (!isDefaultBranch) {
        const autoMergeOn = pr !== null && pr.auto_merge != null;
        const btn = document.createElement('button');
        if (branchSt === 'success') {
          btn.className   = 'merge-btn';
          btn.textContent = 'Merge';
          btn.title       = `Squash-merge ${branch}`;
          btn.addEventListener('click', () => mergeBranch(repo, branch, btn));
        } else {
          btn.className   = autoMergeOn ? 'automerge-btn am-on' : 'automerge-btn am-off';
          btn.textContent = autoMergeOn ? 'Auto Merge ✓' : 'Auto Merge';
          btn.title       = autoMergeOn ? 'Automerge enabled — click to disable' : 'Enable automerge (creates PR if needed)';
          btn.addEventListener('click', () => toggleAutoMergeBranch(repo, branch, btn));
        }
        row.appendChild(btn);
      }

      return row;
    }

    // ── Merge / automerge ────────────────────────────────────────────────────
    // createPRForBranch()/setPRAutoMerge()/mergeBranch()/toggleAutoMergeBranch()
    // now live in github-api.js

    // ── Utility functions ────────────────────────────────────────────────────
    function runSt(run) {
      const s = run.status, c = run.conclusion;
      if (s === 'in_progress' || s === 'queued' || s === 'waiting') return 'running';
      if (c === 'success') return 'success';
      if (c === 'failure') return 'failure';
      return 'other';
    }

    function timeAgo(d) {
      const s = (Date.now() - new Date(d)) / 1000;
      if (s < 60)    return `${Math.round(s)}s ago`;
      if (s < 3600)  return `${Math.round(s/60)}m ago`;
      if (s < 86400) return `${Math.round(s/3600)}h ago`;
      return `${Math.round(s/86400)}d ago`;
    }

    function isToday(d) {
      const x = new Date(d), n = new Date();
      return x.getFullYear() === n.getFullYear() && x.getMonth() === n.getMonth() && x.getDate() === n.getDate();
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatDuration(run) {
      if (!run.run_started_at || !run.updated_at || run.status !== 'completed') return null;
      const secs = Math.round((new Date(run.updated_at) - new Date(run.run_started_at)) / 1000);
      const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60), s = secs % 60;
      if (h > 0) return `${h}h ${m}m ${s}s`;
      if (m > 0) return `${m}m ${s}s`;
      return `${s}s`;
    }

    function calcMood(rate) {
      return MOODS.find(m => rate >= m.min) || MOODS[MOODS.length - 1];
    }

    function updateMoodAndStats() {
      const flat = Object.values(allRunsByRepo).flatMap(({ runsByWf = {} }) => Object.values(runsByWf).flat());
      if (!flat.length) return;

      const done     = flat.filter(r => r.conclusion);
      const rate     = done.length ? done.filter(r => r.conclusion === 'success').length / done.length : 0.5;
      const mood     = calcMood(rate);
      const todayAll = flat.filter(r => isToday(r.created_at));
      const todayOk  = todayAll.filter(r => r.conclusion === 'success').length;

      const emojiEl = document.getElementById('mood-emoji');
      if (mood.emoji !== lastMoodEmoji) {
        emojiEl.classList.remove('pop');
        void emojiEl.offsetWidth;
        emojiEl.classList.add('pop');
        lastMoodEmoji = mood.emoji;
      }
      emojiEl.textContent = mood.emoji;
      document.getElementById('mood-label').textContent = mood.label;

      const pill = document.getElementById('stats-pill');
      pill.textContent = todayAll.length === 0
        ? 'No builds today yet'
        : `${todayOk} / ${todayAll.length} builds passing today`;

      if (msgState.mood !== mood) {
        msgState.mood = mood;
        msgState.idx  = 0;
        if (msgTimer) clearInterval(msgTimer);
        showMsg(mood, 0);
        msgTimer = setInterval(() => {
          msgState.idx = (msgState.idx + 1) % mood.msgs.length;
          showMsg(mood, msgState.idx);
        }, MSG_ROTATE_MS);
      }
    }

    function showMsg(mood, idx) {
      const el = document.getElementById('motivational-msg');
      el.classList.remove('entering');
      el.textContent = mood.msgs[idx];
      el.classList.add('entering');
    }

    // ── Fetch all ────────────────────────────────────────────────────────────
    async function fetchAll() {
      if (!REPOS.length) return;
      const btn  = document.getElementById('refresh-btn');
      const tsEl = document.getElementById('last-refreshed');

      btn.classList.add('loading');
      btn.classList.remove('done');
      tsEl.classList.remove('done');

      await Promise.all(REPOS.map(r => fetchRunsForRepo(r)));
      updateMoodAndStats();
      tsEl.textContent = `Updated ${new Date().toLocaleTimeString()}`;

      btn.classList.remove('loading');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        btn.classList.add('done');
        tsEl.classList.add('done');
        btn.addEventListener('animationend',  () => btn.classList.remove('done'),  { once: true });
        tsEl.addEventListener('animationend', () => tsEl.classList.remove('done'), { once: true });
      }));
    }

    // ── Cards ────────────────────────────────────────────────────────────────
    function rebuildCards() {
      const container = document.getElementById('cards');
      const seen = new Set();
      const html = [];
      REPOS.forEach(r => {
        if (seen.has(r.name)) return;
        seen.add(r.name);
        const wfLabel = (r.workflows || []).join(' · ');
        html.push(`
          <div class="card" id="card-${escHtml(r.name)}">
            <div class="card-title">${escHtml(r.name)}</div>
            <div class="card-subtitle">${escHtml(wfLabel)}</div>
            <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
          </div>`);
      });
      container.innerHTML = html.join('');
    }

    // ── Settings: repo browser ───────────────────────────────────────────────
    async function loadReposForSettings() {
      const token = document.getElementById('s-token').value.trim();
      const org   = document.getElementById('s-org').value.trim();
      if (!token || !org) return;

      const btn = document.getElementById('load-repos-btn');
      const err = document.getElementById('repo-load-err');
      btn.disabled = true;
      btn.innerHTML = '<span class="spin">↻</span>';
      err.textContent = '';

      if (org !== lastLoadedOrg) {
        allRepos = [];
        Object.keys(repoWorkflows).forEach(k => delete repoWorkflows[k]);
        lastLoadedOrg = org;
      }

      const headers = { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' };

      try {
        let list;
        const orgRes = await fetch(
          `https://api.github.com/orgs/${encodeURIComponent(org)}/repos?per_page=100&sort=updated`,
          { headers }
        );
        if (orgRes.ok) {
          list = await orgRes.json();
        } else {
          const userRes = await fetch(
            `https://api.github.com/users/${encodeURIComponent(org)}/repos?per_page=100&sort=updated`,
            { headers }
          );
          if (!userRes.ok) throw new Error(userRes.status);
          list = await userRes.json();
        }

        allRepos = list.map(r => r.name).sort((a, b) => a.localeCompare(b));
        document.getElementById('repo-browser-section').style.display = '';
        document.getElementById('repo-search').value = '';
        renderRepoBrowser('');
      } catch(e) {
        err.textContent = `Could not load repos (${e.message})`;
      } finally {
        btn.disabled = false;
        btn.textContent = '↻';
      }
    }

    function renderRepoBrowser(search) {
      const q        = (search || '').toLowerCase();
      const filtered = q ? allRepos.filter(n => n.toLowerCase().includes(q)) : allRepos;
      const list     = document.getElementById('repo-browser-list');
      list.innerHTML = '';

      if (!filtered.length) {
        list.innerHTML = '<div class="ritem-empty" style="padding:10px 12px">No repos match</div>';
        return;
      }

      filtered.forEach(name => {
        const item = document.createElement('div');
        item.className    = 'repo-item';
        item.dataset.name = name;

        const hdr = document.createElement('div');
        hdr.className = 'repo-item-hdr';
        hdr.innerHTML = `<span class="ritem-arrow">▶</span><span class="ritem-name">${escHtml(name)}</span>`;

        const wfList = document.createElement('div');
        wfList.className     = 'repo-wf-list';
        wfList.style.display = 'none';

        hdr.addEventListener('click', () => toggleRepoExpand(item));
        item.appendChild(hdr);
        item.appendChild(wfList);
        list.appendChild(item);
      });
    }

    async function toggleRepoExpand(item) {
      const name   = item.dataset.name;
      const wfList = item.querySelector('.repo-wf-list');
      const arrow  = item.querySelector('.ritem-arrow');

      if (wfList.style.display !== 'none') {
        wfList.style.display = 'none';
        arrow.textContent    = '▶';
        return;
      }

      wfList.style.display = '';
      arrow.textContent    = '▼';

      if (repoWorkflows[name] !== undefined) {
        renderWorkflows(item, repoWorkflows[name]);
        return;
      }

      wfList.innerHTML = '<div class="ritem-loading">loading…</div>';

      const token = document.getElementById('s-token').value.trim();
      const org   = document.getElementById('s-org').value.trim();

      try {
        const res = await fetch(
          `https://api.github.com/repos/${encodeURIComponent(org)}/${encodeURIComponent(name)}/actions/workflows?per_page=100`,
          { headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' } }
        );
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        repoWorkflows[name] = data.workflows;
        renderWorkflows(item, data.workflows);
      } catch(e) {
        wfList.innerHTML = `<div class="ritem-err">Error (${e.message})</div>`;
      }
    }

    function getMonitoringKeys() {
      const keys = new Set();
      document.querySelectorAll('#repos-list .monitoring-pill').forEach(pill => {
        const repo      = pill.dataset.repo;
        const workflows = JSON.parse(pill.dataset.workflows || '[]');
        workflows.forEach(wf => keys.add(`${repo}::${wf}`));
      });
      return keys;
    }

    function renderWorkflows(item, workflows) {
      const repoName = item.dataset.name;
      const wfList   = item.querySelector('.repo-wf-list');

      if (!workflows || !workflows.length) {
        wfList.innerHTML = '<div class="ritem-empty">No workflows found</div>';
        return;
      }

      const monitoring = getMonitoringKeys();
      wfList.innerHTML = '';

      workflows.forEach(wf => {
        const isAdded = monitoring.has(`${repoName}::${wf.name}`);
        const row     = document.createElement('div');
        row.className = 'wf-item';

        const nameEl = document.createElement('span');
        nameEl.className   = 'wf-name';
        nameEl.textContent = wf.name;

        const btn     = document.createElement('button');
        btn.className   = isAdded ? 'wf-add-btn added' : 'wf-add-btn';
        btn.textContent = isAdded ? '✓' : '+';
        btn.disabled    = isAdded;

        if (!isAdded) {
          btn.addEventListener('click', () => addToMonitoring(repoName, wf.name, btn));
        }

        row.appendChild(nameEl);
        row.appendChild(btn);
        wfList.appendChild(row);
      });
    }

    function addToMonitoring(repoName, workflowName, btn) {
      if (btn) {
        btn.className   = 'wf-add-btn added';
        btn.textContent = '✓';
        btn.disabled    = true;
      }

      const list = document.getElementById('repos-list');
      let pill   = list.querySelector(`.monitoring-pill[data-repo="${CSS.escape(repoName)}"]`);

      if (pill) {
        const workflows = JSON.parse(pill.dataset.workflows || '[]');
        if (!workflows.includes(workflowName)) {
          workflows.push(workflowName);
          pill.dataset.workflows = JSON.stringify(workflows);
          renderPillChips(pill, repoName, workflows);
        }
      } else {
        pill = document.createElement('div');
        pill.className         = 'monitoring-pill';
        pill.dataset.repo      = repoName;
        pill.dataset.workflows = JSON.stringify([workflowName]);

        const repoLabel = document.createElement('span');
        repoLabel.className   = 'pill-repo-name';
        repoLabel.textContent = repoName;

        const chipsEl = document.createElement('span');
        chipsEl.className = 'pill-wf-chips';

        const rmAllBtn = document.createElement('button');
        rmAllBtn.className   = 'pill-remove';
        rmAllBtn.textContent = '✕';
        rmAllBtn.title       = 'Remove repo';
        rmAllBtn.addEventListener('click', () => removeRepoFromMonitoring(pill, repoName));

        pill.appendChild(repoLabel);
        pill.appendChild(chipsEl);
        pill.appendChild(rmAllBtn);
        list.appendChild(pill);
        renderPillChips(pill, repoName, [workflowName]);
      }

      updateMonitoringState();
    }

    function renderPillChips(pill, repoName, workflows) {
      const chipsEl = pill.querySelector('.pill-wf-chips');
      chipsEl.innerHTML = '';
      workflows.forEach(wf => {
        const chip = document.createElement('span');
        chip.className = 'pill-wf-chip';
        chip.appendChild(document.createTextNode(wf));

        const rmBtn = document.createElement('button');
        rmBtn.className   = 'pill-wf-chip-remove';
        rmBtn.textContent = '×';
        rmBtn.title       = `Remove ${wf}`;
        rmBtn.addEventListener('click', () => removeWorkflowFromPill(pill, repoName, wf));
        chip.appendChild(rmBtn);
        chipsEl.appendChild(chip);
      });
    }

    function removeWorkflowFromPill(pill, repoName, workflowName) {
      let workflows = JSON.parse(pill.dataset.workflows || '[]');
      workflows = workflows.filter(w => w !== workflowName);
      if (!workflows.length) { removeRepoFromMonitoring(pill, repoName); return; }
      pill.dataset.workflows = JSON.stringify(workflows);
      renderPillChips(pill, repoName, workflows);
      updateMonitoringState();
      refreshRepoBrowserItem(repoName);
    }

    function removeRepoFromMonitoring(pill, repoName) {
      pill.remove();
      updateMonitoringState();
      refreshRepoBrowserItem(repoName);
    }

    function refreshRepoBrowserItem(repoName) {
      const repoItem = document.querySelector(`#repo-browser-list .repo-item[data-name="${CSS.escape(repoName)}"]`);
      if (repoItem && repoWorkflows[repoName] !== undefined) {
        const wfList = repoItem.querySelector('.repo-wf-list');
        if (wfList && wfList.style.display !== 'none') renderWorkflows(repoItem, repoWorkflows[repoName]);
      }
    }

    function updateMonitoringState() {
      const count = document.querySelectorAll('#repos-list .monitoring-pill').length;
      document.getElementById('monitoring-label').textContent =
        count ? `Monitoring (${count})` : 'Monitoring';
      document.getElementById('monitoring-empty').style.display = count ? 'none' : '';
    }

    // ── Settings panel ───────────────────────────────────────────────────────
    function openSettings() {
      document.getElementById('s-token').value = getToken();
      document.getElementById('s-org').value   = getOrg();
      document.getElementById('repo-load-err').textContent = '';

      const list = document.getElementById('repos-list');
      list.innerHTML = '';
      getRepos().forEach(r => {
        (r.workflows || []).forEach(wf => addToMonitoring(r.name, wf, null));
      });
      updateMonitoringState();

      if (allRepos.length) {
        document.getElementById('repo-browser-section').style.display = '';
        renderRepoBrowser(document.getElementById('repo-search').value);
      } else {
        document.getElementById('repo-browser-section').style.display = 'none';
      }

      document.getElementById('settings-overlay').classList.add('open');
    }

    function closeSettings() {
      document.getElementById('settings-overlay').classList.remove('open');
    }

    function resetAllData() {
      if (!confirm('Remove your token, org, and all monitored repos?')) return;
      localStorage.removeItem('gh_token');
      localStorage.removeItem('gh_org');
      localStorage.removeItem('gh_repos');
      location.reload();
    }

    function overlayClick(e) {
      if (e.target === document.getElementById('settings-overlay')) closeSettings();
    }

    function toggleTokenVis() {
      const inp = document.getElementById('s-token');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    function saveSettings() {
      const token = document.getElementById('s-token').value.trim();
      const org   = document.getElementById('s-org').value.trim();
      if (token) localStorage.setItem('gh_token', token);
      if (org)   localStorage.setItem('gh_org', org);

      const newRepos = [];
      document.querySelectorAll('#repos-list .monitoring-pill').forEach(pill => {
        const workflows = JSON.parse(pill.dataset.workflows || '[]');
        if (workflows.length) newRepos.push({ name: pill.dataset.repo, workflows });
      });
      if (newRepos.length) {
        REPOS = newRepos;
        localStorage.setItem('gh_repos', JSON.stringify(REPOS));
      }

      Object.keys(wfIdCache).forEach(k => delete wfIdCache[k]);
      allRunsByRepo = {};
      prCache = {};
      closeSettings();
      rebuildCards();
      fetchAll();
    }

    // ── Interval picker ──────────────────────────────────────────────────────
    function togglePicker() {
      document.getElementById('interval-options').classList.toggle('open');
    }

    function setRefresh(secs) {
      refreshInterval = secs * 1000;
      clearInterval(refreshTimer);
      refreshTimer = setInterval(fetchAll, refreshInterval);
      const label = secs < 60 ? `${secs}s` : secs === 60 ? '1m' : secs === 90 ? '90s' : '2m';
      document.getElementById('interval-trigger').textContent = label;
      document.querySelectorAll('.iopt').forEach(el =>
        el.classList.toggle('active', +el.dataset.s === secs)
      );
      document.getElementById('interval-options').classList.remove('open');
    }

    document.addEventListener('click', e => {
      if (!document.getElementById('interval-ctrl').contains(e.target))
        document.getElementById('interval-options').classList.remove('open');
    });

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSettings(); });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearInterval(refreshTimer);
        refreshTimer = null;
      } else if (REPOS.length) {
        fetchAll();
        refreshTimer = setInterval(fetchAll, refreshInterval);
      }
    });

    document.getElementById('load-repos-btn').addEventListener('click', loadReposForSettings);
    document.getElementById('repo-search').addEventListener('input', e => renderRepoBrowser(e.target.value));

    // ── Init ─────────────────────────────────────────────────────────────────
    async function init() {
      REPOS = getRepos();
      if (!getToken() || !getOrg() || !REPOS.length) {
        openSettings();
        return;
      }
      rebuildCards();
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
      fetchAll();
      refreshTimer = setInterval(fetchAll, refreshInterval);
    }

    init();
  </script>
</body>
</html>
